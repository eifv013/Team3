# 안드로이드 APK 만들기
#
# 언제 도는가: android/ 폴더나 이 파일이 바뀌었을 때, 또는 Actions 화면에서 직접 실행했을 때.
# 게임 내용(docs/)만 바뀐 패치에는 돌지 않는다. 앱은 켤 때 서버에서 새 게임을 받아 가므로 APK 를 다시 만들 필요가 없다.
#
# 결과물: Releases 의 "apk" 항목에 team3.apk 가 올라간다.
#   받는 주소(항상 같다): https://github.com/eifv013/Team3/releases/latest/download/team3.apk
name: APK 빌드

on:
  push:
    branches: [main]
    paths: ['android/**', '.github/workflows/apk.yml']
  workflow_dispatch:

permissions:
  contents: write   # Releases 에 APK 를 올리기 위해 필요하다

concurrency:
  group: apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'

      # 정식 서명 키: 저장소 Settings → Secrets and variables → Actions 의 두 값으로 키 파일을 만든다.
      #   KEYSTORE_B64 = 키 파일(team3-release.keystore)의 base64, KEYSTORE_PASSWORD = 비밀번호
      #   둘 중 하나라도 없으면 여기서 멈춘다(다른 키로 서명된 APK 가 나가지 않게).
      - name: 서명 키 풀기
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
        run: |
          set -e
          if [ -z "$KEYSTORE_B64" ]; then echo "::error::KEYSTORE_B64 비밀값이 없다"; exit 1; fi
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          echo "KEYSTORE_FILE=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"

      - name: 단위 테스트
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: gradle -p android testReleaseUnitTest --no-daemon

      - name: APK 만들기(서명 포함)
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: gradle -p android assembleRelease --no-daemon

      - name: 서명 확인
        run: |
          set -e
          cp android/app/build/outputs/apk/release/app-release.apk team3.apk
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --print-certs team3.apk | head -3
          # 정식 키 지문과 같아야 한다(다른 키로 나가는 것을 막는 두 번째 확인)
          "$APKSIGNER" verify --print-certs team3.apk | grep -qi "SHA-256 digest: 8f718ecfca1e8264c1380cd3544787ea60d3921807c1b5683535ef5a92394f94" \
            || { echo "::error::정식 서명 키 지문이 아니다"; exit 1; }
          ls -la team3.apk

      - uses: actions/upload-artifact@v4
        with:
          name: team3-apk
          path: team3.apk

      - name: Releases 에 올리기
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          rm -f "$RUNNER_TEMP/release.keystore"
          # 항상 같은 이름(apk)으로 갈아 끼운다. 받는 주소가 바뀌지 않게 하기 위해서다.
          gh release delete apk --yes --cleanup-tag || true
          gh release create apk team3.apk --target "$GITHUB_SHA" \
            --title "수사 3팀 앱 (APK) · 빌드 ${GITHUB_RUN_NUMBER}" \
            --notes "안드로이드 폰에서 team3.apk 를 받아 설치한다. 게임 내용은 앱을 켤 때 자동으로 최신이 된다. 이 파일을 다시 받을 일은 앱 껍데기(아이콘 등)가 바뀔 때뿐이다."
