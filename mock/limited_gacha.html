<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>수사 3팀 한정 뽑기 시안</title>
<style>
:root{--bg:#12151C;--panel:#1B2030;--panel2:#232A3B;--line:#2C3346;--text:#EEF1F7;--muted:#9AA3B5;--acc:#FFB13F;--lim:#B07CF0}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--text);font-family:"Noto Sans KR",system-ui,sans-serif;-webkit-tap-highlight-color:transparent}
button{font-family:inherit}
.ic{display:inline-flex;width:1.15em;height:1.15em;vertical-align:-.2em;margin-right:.18em;flex:none}.ic svg{width:100%;height:100%;display:block}
.wrap{max-width:420px;margin:0 auto;padding:12px 14px 30px}
.top{display:flex;gap:6px;margin-bottom:10px}
.top span{display:inline-flex;align-items:center;justify-content:center;gap:4px;flex:1;padding:7px 4px;border-radius:10px;background:var(--panel2);text-align:center;font-size:12.5px;color:var(--muted);white-space:nowrap}
.top b{color:var(--text);font-size:14px}
.tabs{display:flex;gap:6px;padding:5px;border-radius:14px;background:#0E1118;margin-bottom:10px}
.tabs button{flex:1;height:40px;border:0;border-radius:10px;background:transparent;color:var(--muted);font-weight:800;font-size:14px}
.tabs button.on{background:var(--panel2);color:var(--acc)}
.tabs button.lim.on{color:#E2C8FF}
.ban{position:relative;border-radius:18px;overflow:hidden;box-shadow:inset 0 0 0 1.5px rgba(200,170,255,.5)}
.ban img{display:block;width:100%;aspect-ratio:1/1;object-fit:cover}
.ban::after{content:'';position:absolute;inset:45% 0 0;background:linear-gradient(180deg,transparent,rgba(10,8,18,.95))}
.rib{position:absolute;top:12px;left:12px;z-index:2;padding:4px 10px;border-radius:999px;background:linear-gradient(90deg,#B07CF0,#7A4AD8);font-size:12px;font-weight:900}
.left{position:absolute;top:12px;right:12px;z-index:2;padding:4px 10px;border-radius:999px;background:rgba(10,8,16,.8);font-size:12px;font-weight:800;color:#D8C8FF}
.bt{position:absolute;left:14px;right:14px;bottom:12px;z-index:2}
.bt small{display:block;color:#C9B4F5;font-size:12.5px;font-weight:700}
.bt b{display:block;font-size:22px;font-weight:900;margin-top:2px}
.stars{margin-top:4px;font-size:16px;letter-spacing:1px;color:#FFC93C}.stars s{text-decoration:none;color:rgba(255,255,255,.25)}
.card{margin-top:10px;padding:12px;border-radius:14px;background:var(--panel)}
.row{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:13.5px}
.row+.row{margin-top:8px}
.row span{color:var(--muted)}.row b{font-weight:800}
.bar{height:10px;border-radius:6px;background:#0E1118;overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,#7A4AD8,#E2C8FF);transform-origin:left;transition:transform .3s}
.pick{color:#E2C8FF}
.btns{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.btns button{height:56px;border:0;border-radius:14px;font-size:15px;font-weight:900;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.btns button em{display:inline-flex;align-items:center;gap:3px;font-style:normal;font-size:12px;font-weight:700;opacity:.8}
.b1{background:var(--panel2);color:var(--text);box-shadow:inset 0 0 0 1px var(--line)}
.b10{background:linear-gradient(180deg,#C9A2FF,#8A58E6);color:#1B1030;box-shadow:0 4px 0 #5B33A8}
.note{margin-top:10px;font-size:12px;color:var(--muted);line-height:1.6}
.rbox{margin-top:10px;padding:10px 12px;border-radius:14px;background:var(--panel)}.rbox summary{font-size:13px;font-weight:700;color:var(--muted);cursor:pointer}
.rt{width:100%;border-collapse:collapse;font-size:13px;margin-top:6px}.rt th,.rt td{padding:6px;border-bottom:1px solid var(--line);text-align:left}.rt th{color:var(--muted);font-weight:600}.rt td:last-child,.rt th:last-child{text-align:right}.rt tr.g td{color:#E2C8FF;font-weight:800}
.rbox p{margin:6px 0 0;font-size:12.5px;color:var(--muted)}
.simres{margin-top:8px;padding:0 2px;font-size:13px}.simres:empty{display:none}.simres b{display:block;margin-bottom:6px;color:var(--text)}
.simres div{display:grid;grid-template-columns:70px 1fr 52px;gap:8px;align-items:center;margin-top:5px;color:var(--muted)}
.simres div>i{height:10px;border-radius:5px;background:#0E1118;overflow:hidden}.simres div>i>i{display:block;height:100%;background:linear-gradient(90deg,#7A4AD8,#E2C8FF);transform-origin:left}
.simres em{font-style:normal;text-align:right;color:var(--text);font-weight:800}
.label{font-size:12px;color:var(--muted);font-weight:700;margin:14px 0 6px}
.seg{display:flex;gap:6px}.seg button{flex:1;height:36px;border:0;border-radius:10px;background:var(--panel2);color:var(--muted);font-weight:800;font-size:13px}.seg button.on{background:var(--acc);color:#1B1E24}
/* 결과 */
.res{position:fixed;inset:0;z-index:20;background:rgba(6,7,11,.94);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:18px;animation:fi .15s}
.res[hidden]{display:none}
@keyframes fi{from{opacity:0}}
.res h2{margin:0 0 12px;font-size:18px}
.grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px;width:100%;max-width:400px}
.grid.one{grid-template-columns:1fr;max-width:200px}
.cell{position:relative;aspect-ratio:1/1;border-radius:12px;background:#2A303B;border:2px solid var(--gc);padding:3px;animation:pop .35s cubic-bezier(.3,1.5,.6,1) both}
.cell svg{width:100%;height:100%}
.cell img{width:100%;height:100%;object-fit:cover;border-radius:8px;display:block}
.cell.ghost{box-shadow:0 0 0 2px #E2C8FF,0 0 22px rgba(200,160,255,.8)}
.cell i{position:absolute;left:2px;right:2px;bottom:2px;font-style:normal;font-size:9px;text-align:center;border-radius:0 0 8px 8px;background:rgba(10,12,18,.8);color:#FFC93C;white-space:nowrap}
.cell .nw{position:absolute;top:2px;left:2px;padding:0 4px;border-radius:5px;background:#FF5F57;color:#fff;font-size:9px;font-weight:900}
@keyframes pop{from{transform:scale(.4);opacity:0}}
.sum{margin-top:12px;font-size:14px;color:#E2C8FF;font-weight:800;text-align:center;min-height:20px}
.res .ok{margin-top:14px;width:100%;max-width:400px;height:50px;border:0;border-radius:14px;background:var(--acc);color:#1B1E24;font-weight:900;font-size:16px}
.flash{position:fixed;inset:0;z-index:21;pointer-events:none;background:radial-gradient(circle,rgba(226,200,255,.95),rgba(122,74,216,.6) 50%,transparent 75%);animation:fl .9s ease-out forwards}
@keyframes fl{from{opacity:1}to{opacity:0}}
</style></head><body><div class="wrap">

<script>/*

 *   draw(id, { grade:'c'|'r'|'h'|'l', mood:'happy'|'huh', anim:bool, outfit }) → '<svg …>'
 *   틀: 머리와 몸을 한 윤곽(MOCHI, 찹쌀떡)으로 그리고 같은 계열 진한 색 테두리. 눈·코·입은 얼굴 아래쪽에 작게.
 *   등급 꾸밈: 일반 = 동 배지 / 희귀 = 경찰모 · 은 배지 / 영웅 = 경찰모 · 빨간 망토 · 금 배지 / 전설 = 금빛 후광 · 금 경찰모 · 반짝임.
 *   proto/mascot.html 시안에서 옮겨 왔다(시안과 같은 그림).
 */
(function (root, factory) {
  if (typeof module === 'object' && module.exports) module.exports = factory();
  else root.Team3PetArt = factory();
})(typeof self !== 'undefined' ? self : this, function () {
  'use strict';
  var SKY = '#9CD3F2', SKY_D = '#4F86A8', INK = '#1B1E24';

  /* ---------- 의상: 머리 위 기준점(cx, top)과 머리 너비(w)에 맞춰 그린다 ---------- */

    s += '<path d="M' + (cx - w / 2) + ' ' + (top + h) + 'c0-' + (h * 1.1) + ' ' + (w * 0.2) + '-' + (h * 1.35) + ' ' + (w / 2) + '-' + (h * 1.35) + 's' + (w / 2) + ' ' + (h * 0.25) + ' ' + (w / 2) + ' ' + (h * 1.35) + 'z" fill="' + c + '"/>';
    s += '<rect x="' + (cx - w / 2 - 3) + '" y="' + (top + h - 8) + '" width="' + (w + 6) + '" height="13" rx="5" fill="' + c + '" stroke="#F4EFE2" stroke-width="2"/>';
    for (var x = cx - w / 2 + 4; x < cx + w / 2; x += 8) s += '<line x1="' + x + '" y1="' + (top + h - 6) + '" x2="' + x + '" y2="' + (top + h + 3) + '" stroke="#F4EFE2" stroke-width="1.3"/>';
    s += '<circle cx="' + cx + '" cy="' + (top - h * 0.38) + '" r="9" fill="#F0525A"/><circle cx="' + (cx - 3) + '" cy="' + (top - h * 0.38 - 3) + '" r="3" fill="#fff" opacity=".5"/></g>';

  }
  function fedora(cx, top, w, c) {
    return '<g><path d="M' + (cx - w * 0.36) + ' ' + (top + 2) + 'l6-' + (w * 0.36) + 'q' + (w * 0.15) + '-8 ' + (w * 0.3) + ' 0q' + (w * 0.15) + '-8 ' + (w * 0.3) + ' 0l6 ' + (w * 0.36) + 'z" fill="' + c + '"/>' +
      '<path d="M' + (cx - w * 0.36) + ' ' + (top - 6) + 'h' + (w * 0.72) + '" stroke="#F4EFE2" stroke-width="4"/>' +
      '<path d="M' + (cx - w * 0.75) + ' ' + (top + 4) + 'h' + (w * 1.5) + '" stroke="' + c + '" stroke-width="9" stroke-linecap="round"/></g>';
  }
  function glasses(cx, ey, gap, r) {
    return '<g><circle cx="' + (cx - gap) + '" cy="' + ey + '" r="' + r + '" fill="' + SKY + '" stroke="' + INK + '" stroke-width="3"/>' +
      '<circle cx="' + (cx + gap) + '" cy="' + ey + '" r="' + r + '" fill="' + SKY + '" stroke="' + INK + '" stroke-width="3"/>' +
      '<line x1="' + (cx - gap + r) + '" y1="' + ey + '" x2="' + (cx + gap - r) + '" y2="' + ey + '" stroke="' + INK + '" stroke-width="3"/>' +
      '<circle cx="' + (cx - gap) + '" cy="' + ey + '" r="3" fill="' + INK + '"/><circle cx="' + (cx + gap) + '" cy="' + ey + '" r="3" fill="' + INK + '"/></g>';
  }
  function mask(cx, y, w) {
    return '<g><path d="M' + (cx - w / 2) + ' ' + y + 'h' + w + 'v10c0 10-' + (w * 0.22) + ' 16-' + (w / 2) + ' 16s-' + (w / 2) + '-6-' + (w / 2) + '-16z" fill="' + SKY + '" stroke="' + INK + '" stroke-width="1.6"/>' +
      '<path d="M' + (cx - w * 0.38) + ' ' + (y + 7) + 'h' + (w * 0.76) + 'M' + (cx - w * 0.34) + ' ' + (y + 13) + 'h' + (w * 0.68) + '" stroke="' + SKY_D + '" stroke-width="2" stroke-linecap="round"/></g>';
  }

  /*
   * 0.3 시안: 머리와 몸을 한 덩어리로 잇는다.
   *  - 머리와 몸이 같은 그라디언트(userSpaceOnUse: 그림 전체에 빛 하나)를 써서 겹치는 곳에 이음매가 생기지 않는다.
   *  - 목줄처럼 가로로 끊는 띠는 없앴다. 대신 주둥이 → 가슴으로 이어지는 흰 털(턱받이)이 머리와 몸을 이어 준다.
   *  - 고양이(랙돌)는 목 갈기, 너구리는 밝은 배 털이 같은 역할을 한다.
   */
  function rg(id, a, b, c) {
    return '<radialGradient id="' + id + '" gradientUnits="userSpaceOnUse" cx="82" cy="52" r="165"><stop offset="0" stop-color="' + a + '"/><stop offset=".55" stop-color="' + b + '"/><stop offset="1" stop-color="' + c + '"/></radialGradient>';
  }
  var DEFS = '<defs>' +
    rg('gCorgi', '#F4B66C', '#E0913F', '#B96A26') + rg('gShiba', '#F0A766', '#D27A35', '#A65A22') +
    rg('gCream', '#FFFDF7', '#F6ECDA', '#DCCBAE') + rg('gRag', '#FFFCF5', '#F1E6D4', '#D5C3A6') + rg('gSiam', '#FBF1DF', '#EBD9BB', '#CDB48F') +
    rg('gPoint', '#8C6A52', '#5E4433', '#3E2C22') + rg('gRagPt', '#9C8778', '#76645A', '#54463F') + rg('gRac', '#B5BAC2', '#8E949E', '#6A707A') +
    rg('gRacBelly', '#F3EEE4', '#E1D9CA', '#C5BBA8') + rg('gDark', '#4A4C55', '#2C2E35', '#1C1D22') +
    '<radialGradient id="gBlue" cx="50%" cy="35%" r="65%"><stop offset="0" stop-color="#BFE8FF"/><stop offset=".6" stop-color="#5BB2E8"/><stop offset="1" stop-color="#2F7CC0"/></radialGradient>' +
    '<radialGradient id="gNose" cx="35%" cy="30%" r="70%"><stop offset="0" stop-color="#4A4F5C"/><stop offset="1" stop-color="#14171D"/></radialGradient>' +
    '<radialGradient id="gShadow" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="rgba(0,0,0,.32)"/><stop offset="1" stop-color="rgba(0,0,0,0)"/></radialGradient>' +
    '<linearGradient id="gGold" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFE48A"/><stop offset="1" stop-color="#D9A51E"/></linearGradient>' +
    '<linearGradient id="gCoat" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFE066"/><stop offset="1" stop-color="#E0B21E"/></linearGradient>' +
    '<radialGradient id="gPtSoft"><stop offset="0" stop-color="#9C8170" stop-opacity=".75"/><stop offset=".7" stop-color="#B39A88" stop-opacity=".45"/><stop offset="1" stop-color="#B39A88" stop-opacity="0"/></radialGradient>' +
    '<radialGradient id="gPtSoftD"><stop offset="0" stop-color="#5E4233" stop-opacity=".95"/><stop offset=".65" stop-color="#7A5A46" stop-opacity=".7"/><stop offset="1" stop-color="#7A5A46" stop-opacity="0"/></radialGradient>' +
    '</defs>';
  // 0.8.0 조는 중(mood:'sleep'): 눈을 감는다 — 아래로 둥근 감은 눈 선(∪). 그리는 동안만 켜 두는 깃발
  var SLEEP = false;
  function shut(x, y, rx, c) { return '<path d="M' + (x - rx) + ' ' + (y - 1) + ' q' + rx + ' ' + (rx * 0.75) + ' ' + (rx * 2) + ' 0" stroke="' + (c || '#2A1E1A') + '" stroke-width="3.6" fill="none" stroke-linecap="round"/>'; }
  // 큰 눈: 짙은 눈동자 + 큰 반짝임 + 작은 반짝임
  function eye(x, y, rx, ry) {
    if (SLEEP) return shut(x, y, rx);
    return '<ellipse cx="' + x + '" cy="' + y + '" rx="' + rx + '" ry="' + ry + '" fill="#1B1E24"/>' +
      '<ellipse cx="' + (x - rx * 0.3) + '" cy="' + (y - ry * 0.35) + '" rx="' + (rx * 0.42) + '" ry="' + (ry * 0.36) + '" fill="#fff"/>' +
      '<circle cx="' + (x + rx * 0.35) + '" cy="' + (y + ry * 0.35) + '" r="' + (rx * 0.18) + '" fill="#fff" opacity=".85"/>';
  }
  // 파란 눈(랙돌 · 샴): 홍채 + 세로 동공 + 반짝임
  function blueEye(x, y, rx, ry) {
    if (SLEEP) return shut(x, y, rx);
    return '<ellipse cx="' + x + '" cy="' + y + '" rx="' + rx + '" ry="' + ry + '" fill="url(#gBlue)"/>' +
      '<ellipse cx="' + x + '" cy="' + (y + 1) + '" rx="' + (rx * 0.45) + '" ry="' + (ry * 0.78) + '" fill="#1B1E24"/>' +
      '<ellipse cx="' + (x - rx * 0.32) + '" cy="' + (y - ry * 0.4) + '" rx="' + (rx * 0.36) + '" ry="' + (ry * 0.28) + '" fill="#fff"/>' +
      '<circle cx="' + (x + rx * 0.35) + '" cy="' + (y + ry * 0.38) + '" r="' + (rx * 0.16) + '" fill="#fff" opacity=".85"/>';
  }
  function happyEye(x, y, w, c) { return '<path d="M' + (x - w) + ' ' + y + ' q' + w + '-' + (w * 1.1) + ' ' + (w * 2) + ' 0" stroke="' + (c || '#1B1E24') + '" stroke-width="4" fill="none" stroke-linecap="round"/>'; }
  function blush(x, y) { return '<ellipse cx="' + x + '" cy="' + y + '" rx="9" ry="5.5" fill="#FF8A8A" opacity=".45"/>'; }
  function shadow() { return '<ellipse cx="100" cy="194" rx="58" ry="7" fill="url(#gShadow)"/>'; }
  function wrap(o, inner) {
    return '<svg viewBox="0 0 200 200" aria-hidden="true">' + DEFS + shadow() + '<g class="' + (o.mood === 'happy' ? 'pb-hop' : o.mood === 'huh' ? 'pb-tilt' : '') + '">' + inner + '</g></svg>';
  }
  function huhMark() { return '<g><circle cx="162" cy="40" r="15" fill="#FFD23F"/><text x="162" y="47" font-size="20" font-weight="700" text-anchor="middle" fill="#1B1E24" font-family="IBM Plex Sans KR">?</text></g>'; }
  function sparkle(x, y) { return '<path d="M' + x + ' ' + (y - 9) + ' l2.6 6.4 6.4 2.6-6.4 2.6-2.6 6.4-2.6-6.4-6.4-2.6 6.4-2.6z" fill="#FFE27A"/>'; }
  // 가슴의 3팀 배지(별 모양 경찰 배지). 띠 없이 털에 달려 있어 머리와 몸을 끊지 않는다.
  function badge(x, y) {
    return '<path d="M' + x + ' ' + (y - 11) + ' l3.3 6.6 7.3 1-5.3 5.2 1.3 7.2-6.6-3.5-6.6 3.5 1.3-7.2-5.3-5.2 7.3-1z" fill="url(#gGold)"/>' +
      '<text x="' + x + '" y="' + (y + 4) + '" font-size="8" font-weight="700" text-anchor="middle" fill="#6B4E00" font-family="IBM Plex Sans KR">3</text>';
  }
  function mouth(o, y) {
    if (o.outfit === 'mask') return '';
    if (o.mood === 'happy') return '<path d="M88 ' + y + ' q12 12 24 0" fill="#7A2C34"/><path d="M95 ' + (y + 4) + ' q5 10 10 0z" fill="#FF8C95"/>';
    if (o.mood === 'huh') return '<path d="M94 ' + (y + 3) + ' q6-3 12 0" stroke="#1B1E24" stroke-width="3" fill="none" stroke-linecap="round"/>';
    return '<path d="M100 ' + (y - 6) + ' v4 M100 ' + (y - 2) + ' q-6 6-11 2 M100 ' + (y - 2) + ' q6 6 11 2" stroke="#1B1E24" stroke-width="2.6" fill="none" stroke-linecap="round"/>';
  }
  function extras(o, hat, eyeY, maskY, maskW, glassesOk) {
    var s = '';
    if (o.mood === 'huh') s += huhMark();
    if (o.mood === 'happy') s += sparkle(36, 52) + sparkle(166, 42);
    if (o.outfit === 'raincoat') s += '<path d="M46 72 q54-58 108 0 l4 12 q-58-28-116 0z" fill="url(#gCoat)"/>';
    if (o.outfit === 'beanie') s += beanie(100, hat, 100, '#2F3646');
    if (o.outfit === 'fedora') s += fedora(100, hat + 4, 88, '#3A2A1E');
    if (glassesOk && (o.outfit === 'glasses' || o.outfit === 'fedora')) s += glasses(100, eyeY, 22, 14);
    if (o.outfit === 'mask') s += mask(100, maskY, maskW);
    return s;
  }
  // 공통 몸통: 어깨가 머리 뒤에서 시작해 아래로 넓어진다(머리와 같은 색이라 이음매가 안 보인다).
  var BODY = 'M56 192 q-8-58 44-76 q52 18 44 76z';
  var HEAD = 'M100 30 c38 0 60 22 60 56 c0 32-26 54-60 54 c-34 0-60-22-60-54 c0-34 22-56 60-56z';

  /*
   * 4차 "말랑" 스타일: 캐릭터 상품(스티커 · 인형) 말투.
   *  - 머리와 몸을 처음부터 "한 개의 윤곽선"으로 그린다(찹쌀떡 모양). 이음매가 생길 수 없다.
   *  - 머리가 전체의 2/3, 몸은 아래에 살짝만. 눈 · 코 · 입은 얼굴 아래쪽에 작게 모은다(아기 얼굴 비율).
   *  - 몸 색보다 짙은 같은 계열 색의 테두리 선(3.5px)으로 스티커처럼 또렷하게.
   */
  var MOCHI = 'M100 26 C152 26 174 58 174 98 C174 124 162 140 148 148 C152 162 152 178 146 190 H54 C48 178 48 162 52 148 C38 140 26 124 26 98 C26 58 48 26 100 26 Z';
  function k(fill, line) { return ' fill="' + fill + '" stroke="' + line + '" stroke-width="3.5" stroke-linejoin="round"'; }
  function kEyes(o, y, blue) {
    if (o.mood === 'happy') return happyEye(72, y + 2, 9, '#2A1E1A') + happyEye(128, y + 2, 9, '#2A1E1A');
    var e = function (x) {
      if (SLEEP) return shut(x, y, 9);
      return blue
        ? '<ellipse cx="' + x + '" cy="' + y + '" rx="10" ry="12" fill="url(#gBlue)" stroke="#2A1E1A" stroke-width="2"/><ellipse cx="' + x + '" cy="' + (y + 1) + '" rx="5" ry="8" fill="#1B1E24"/>' +
          '<ellipse cx="' + (x - 3.5) + '" cy="' + (y - 5) + '" rx="4" ry="3.6" fill="#fff"/><circle cx="' + (x + 4) + '" cy="' + (y + 5) + '" r="1.8" fill="#fff"/>'
        : '<ellipse cx="' + x + '" cy="' + y + '" rx="9" ry="11" fill="#2A1E1A"/><ellipse cx="' + (x - 3) + '" cy="' + (y - 4.5) + '" rx="4" ry="3.8" fill="#fff"/><circle cx="' + (x + 3.5) + '" cy="' + (y + 4.5) + '" r="1.8" fill="#fff"/>';
    };
    return '<g class="' + (o.anim ? 'pb-blink' : '') + '">' + e(72) + e(128) + '</g>';
  }
  function kFace(o, y, nose) {
    var s = '<ellipse cx="56" cy="' + (y + 16) + '" rx="12" ry="7" fill="#FF8FA3" opacity=".5"/><ellipse cx="144" cy="' + (y + 16) + '" rx="12" ry="7" fill="#FF8FA3" opacity=".5"/>';
    if (nose) s += '<ellipse cx="100" cy="' + (y + 10) + '" rx="5.5" ry="3.8" fill="' + nose + '"/>';
    if (o.outfit === 'mask') return s;
    if (o.mood === 'happy') s += '<path d="M92 ' + (y + 16) + ' q8 11 16 0z" fill="#B23A4C" stroke="#2A1E1A" stroke-width="2" stroke-linejoin="round"/>';
    else if (o.mood === 'huh') s += '<path d="M95 ' + (y + 19) + ' q5-3 10 0" stroke="#2A1E1A" stroke-width="2.4" fill="none" stroke-linecap="round"/>';

    return s;
  }
  function kShine() { return '<ellipse cx="74" cy="46" rx="20" ry="8" fill="#fff" opacity=".35" transform="rotate(-18 74 46)"/>'; }
  // 작은 두 손으로 가슴의 3팀 배지를 들고 있다 + 발
  function kPaws(fill, line, foot) {
    return badge(100, 164) +
      '<ellipse cx="80" cy="166" rx="10" ry="8"' + k(fill, line) + '/><ellipse cx="120" cy="166" rx="10" ry="8"' + k(fill, line) + '/>' +
      '<ellipse cx="74" cy="190" rx="13" ry="7"' + k(foot || fill, line) + '/><ellipse cx="126" cy="190" rx="13" ry="7"' + k(foot || fill, line) + '/>';
  }
  /*
   * 의상(0.3.1): 모자(HATS)는 머리 위, 안경 · 선글라스 · 마스크는 눈높이(eyeY)에.
   *   hatT: 머리 위에 눈이 있는 개구리처럼 모자를 옮길 때의 transform(없으면 그대로).
   */
  var HATS = { raincoat: 1, beanie: 1, fedora: 1, bow: 1 };
  function sunglasses(cx, ey) {
    var lens = function (x) { return '<path d="M' + (x - 17) + ' ' + (ey - 9) + 'h34q2 0 1 3l-3 10q-3 8-14 8t-15-8l-3-10q-1-3 1-3z" fill="#1E2330" stroke="#0E1118" stroke-width="2.4" stroke-linejoin="round"/>' +
      '<path d="M' + (x - 11) + ' ' + (ey - 4) + 'l9 0" stroke="#fff" stroke-width="2.4" stroke-linecap="round" opacity=".55"/>'; };
    return '<g>' + lens(cx - 28) + lens(cx + 28) + '<path d="M' + (cx - 11) + ' ' + (ey - 6) + 'q11-5 22 0" stroke="#0E1118" stroke-width="3" fill="none"/></g>';
  }
  function bow(x, y) {
    return '<g transform="rotate(14 ' + x + ' ' + y + ')"><path d="M' + x + ' ' + y + 'l-22-14q-6 0-6 8v12q0 8 6 8z" fill="#FF6B8A" stroke="#C23A5A" stroke-width="2.6" stroke-linejoin="round"/>' +
      '<path d="M' + x + ' ' + y + 'l22-14q6 0 6 8v12q0 8-6 8z" fill="#FF6B8A" stroke="#C23A5A" stroke-width="2.6" stroke-linejoin="round"/>' +
      '<circle cx="' + x + '" cy="' + y + '" r="7" fill="#FF8FA6" stroke="#C23A5A" stroke-width="2.6"/></g>';
  }
  /*
   * 머리 위에 "얹는" 모자(0.3.1 다시 그림). 말랑 머리는 위 끝이 y=26, 눈은 y≈100.
   *   모자 아래 끝이 y≈52~62 에서 멈춰 눈을 가리지 않고, 폭은 머리(52~148)보다 좁아 귀가 옆으로 나온다.
   *   살짝 기울이고(rotate) 같은 계열 진한 색 테두리를 둘러 다른 그림과 말투를 맞춘다.
   */
  function knitBeanie() {
    var L = '#232A3B', s = '<g transform="rotate(-7 100 40)">';
    s += '<path d="M60 46 C58 16 78 4 100 4 C122 4 142 16 140 46 Z" fill="#45527A" stroke="' + L + '" stroke-width="3.5" stroke-linejoin="round"/>';
    for (var x = 72; x <= 128; x += 11) s += '<path d="M' + x + ' ' + (x === 72 || x === 127 ? 22 : 14) + ' V40" stroke="#5A6A96" stroke-width="3" stroke-linecap="round"/>';
    s += '<rect x="54" y="38" width="92" height="17" rx="8.5" fill="#6475A3" stroke="' + L + '" stroke-width="3.5"/>';
    for (var y = 62; y <= 138; y += 8) s += '<path d="M' + y + ' 42 v9" stroke="#4E5D86" stroke-width="2.4" stroke-linecap="round"/>';
    s += '<circle cx="100" cy="2" r="11" fill="#F0525A" stroke="#9E2A33" stroke-width="3"/><circle cx="96" cy="-2" r="3.5" fill="#fff" opacity=".55"/>';
    return s + '</g>';
  }
  // 0.10.5 해무항 선장 모자(예전 우비 모자 자리 · 저장 id 'raincoat' 그대로). 채우기는 모두 단색 — 그라디언트 id 가 없는 그림에서도 비지 않게
  function rainHat() {
    var L = '#1D2740', s = '<g transform="rotate(-8 100 40)">';
    s += '<path d="M62 46 C58 20 78 8 100 8 C122 8 142 20 138 46 Z" fill="#F4F6FA" stroke="' + L + '" stroke-width="3.5" stroke-linejoin="round"/>';

var COLOR={c:'#A3ACBA',r:'#5BB2E8',h:'#B07CF0',l:'#FFD23F'};
var PCT={c:66,r:28,h:5,l:1};
var st={tickets:5,gems:300,treats:0,ghost:0,pity:0,pulls:0,own:{}}, rate=0.2, PITY=180, SOFT=156, STEP=4, hits=[];
function rateAt(k){return k>=PITY?100:Math.min(100,rate+(k>=SOFT?(k-SOFT+1)*STEP:0))}
function $(i){return document.getElementById(i)}
function stars(n){return '★'.repeat(n)+'<s>'+'★'.repeat(5-n)+'</s>'}
function draw(){
  $('w-t').textContent=st.tickets; $('w-g').textContent=st.gems; $('w-s').textContent=st.treats;
  $('g-st').innerHTML=st.ghost?stars(st.ghost):'<span style="font-size:13px;color:#C9B4F5">아직 없음</span>';
  $('pity-n').textContent=st.pity; $('pity-max').textContent=PITY; $('pity-bar').style.transform='scaleX('+(st.pity/PITY)+')';
  var other=100-rate, t='<table class="rt"><tr><th>결과</th><th>확률</th></tr><tr class="g"><td>고스트(한정 전설)</td><td>'+rate+'%</td></tr>';
  [['l','전설'],['h','영웅'],['r','희귀'],['c','일반']].forEach(function(x){t+='<tr><td style="color:'+COLOR[x[0]]+'">'+x[1]+'</td><td>'+(Math.round(PCT[x[0]]*other)/100)+'%</td></tr>'});
  t+='</table><table class="rt" style="margin-top:8px"><tr><td>확률 상승</td><td>'+SOFT+'번째부터 +'+STEP+'%씩</td></tr><tr><td>확정</td><td>'+PITY+'번째</td></tr><tr><td>또 뽑히면</td><td>★ +1, ★5 뒤 간식 40</td></tr></table>';
  $('rates').innerHTML=t;
  var I=window.Team3Icons; $('c1').innerHTML=I.icon('gem')+' 10'; $('c10').innerHTML=I.icon('gem')+' 90';
  $('stat').textContent='뽑은 횟수 '+st.pulls;
  $('log').textContent=hits.length?'고스트가 나온 회차: '+hits.join(', '):'';
}
function one(){
  st.pulls++;
  if(Math.random()*100<rateAt(st.pity+1)){ hits.push(st.pity+1); st.pity=0; return {g:'l',ghost:true}; }
  st.pity++;
  var r=Math.random()*(100-rate), g='c', acc=0; for(var k of ['l','h','r','c']){acc+=PCT[k]; if(r<acc){g=k;break}} 
  var sp=P.SPECIES[Math.floor(Math.random()*P.SPECIES.length)];
  return {g:g,id:sp.id,name:sp.name};
}
function pull(n){
  var c=n===10?90:10; if(st.gems<c){alert('배지가 모자라요');return} st.gems-=c;
  var out=[], gotGhost=0, treat=0;
  for(var i=0;i<n;i++){ var r=one();
    if(r.ghost){ if(st.ghost<5){ r.isNew=!st.ghost; st.ghost++; r.star=st.ghost; } else { treat+=40; r.star=5; r.dup=true; } gotGhost++; }
    else { var key=r.id+':'+r.g; r.isNew=!st.own[key]; st.own[key]=(st.own[key]||0)+1; }
    out.push(r); }
  st.treats+=treat; show(out,gotGhost,treat); draw();
}
function show(out,gg,treat){
  var g=$('grid'); g.className='grid'+(out.length===1?' one':'');
  g.innerHTML=out.map(function(r,i){
    var d='animation-delay:'+(i*0.06)+'s;--gc:'+COLOR[r.g];
    if(r.ghost) return '<div class="cell ghost" style="'+d+'"><img alt="" src="'+GH+'"><i>'+'★'.repeat(r.star)+'</i>'+(r.isNew?'<b class="nw">NEW</b>':'')+'</div>';
    return '<div class="cell" style="'+d+'">'+A.draw(r.id,{grade:r.g})+(r.isNew?'<b class="nw">NEW</b>':'')+'</div>';
  }).join('');
  $('res-t').textContent=out.length+'회 결과';
  $('sum').innerHTML=gg?('고스트 '+gg+'번! 현재 ★'+st.ghost+(treat?', 간식 +'+treat:'')):'';
  $('res').hidden=false;
  if(gg){var f=document.createElement('div');f.className='flash';document.body.appendChild(f);setTimeout(function(){f.remove()},900)}
}
$('p1').onclick=function(){pull(1)}; $('p10').onclick=function(){pull(10)};
$('ok').onclick=function(){$('res').hidden=true};
function seg(id,cb){$(id).addEventListener('click',function(e){var b=e.target.closest('button');if(!b)return;[].forEach.call(this.children,function(c){c.classList.toggle('on',c===b)});cb(+b.dataset.v);draw()})}
seg('s-rate',function(v){rate=v});
/* 1000명이 처음 고스트를 받을 때까지 뽑으면 몇 회에 받는지 */
$('sim').onclick=function(){var a=[];for(var t=0;t<1000;t++){var k=0;while(true){k++;if(Math.random()*100<rateAt(k))break}a.push(k)}
  var b=[[30,'30회 안'],[100,'100회 안'],[155,'155회 안'],[164,'164회 안'],[180,'180회 안']];
  $('simres').innerHTML='<b>기본 '+rate+'%로 1000명</b>'+b.map(function(x){var n=a.filter(function(v){return v<=x[0]}).length;return '<div><span>'+x[1]+'</span><i><i style="transform:scaleX('+(n/1000)+')"></i></i><em>'+n+'명</em></div>'}).join('');};
$('reset').onclick=function(){st={tickets:5,gems:300,treats:0,ghost:0,pity:0,pulls:0,own:{}};hits=[];draw()};
$('give').onclick=function(){st.gems+=1000;draw()};
[].forEach.call(document.querySelectorAll('.ic'),function(e){e.outerHTML=window.Team3Icons.icon(e.dataset.ic)});
draw();
})();
</script></body></html>
