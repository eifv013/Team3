.pet{position:absolute;left:30px;bottom:2px;transition-property:left;transition-timing-function:ease-in-out;cursor:pointer}
.pet .in{position:relative;transform-origin:50% 100%;will-change:transform}
.pet .flip{transform-origin:50% 100%}
.pet.left .flip{transform:scaleX(-1)}
.pet img{display:block;height:100%;width:auto;pointer-events:none;-webkit-user-drag:none}
.pet svg{width:100%;height:100%;display:block;overflow:visible}
.shadow{position:absolute;left:50%;bottom:-3px;width:70%;height:9px;margin-left:-35%;border-radius:50%;background:radial-gradient(closest-side,rgba(0,0,0,.55),rgba(0,0,0,0))}
/* 누아르 파트너: 그림 한 장을 몸 전체로 흔든다(다리는 따로 안 움직임) */
.noir.walk .in{animation:nwalk .56s ease-in-out infinite}
@keyframes nwalk{0%,100%{transform:translateY(0) rotate(-1.6deg)}25%{transform:translateY(-3px) rotate(0)}50%{transform:translateY(0) rotate(1.6deg)}75%{transform:translateY(-3px) rotate(0)}}
.noir.run .in{animation:nrun .3s ease-in-out infinite}
@keyframes nrun{0%,100%{transform:translateY(0) rotate(5deg) scaleY(.98)}50%{transform:translateY(-6px) rotate(7deg) scaleY(1.01)}}
.noir.idle .in{animation:nbreath 2.6s ease-in-out infinite}
@keyframes nbreath{0%,100%{transform:scale(1,1)}50%{transform:scale(1.008,1.018)}}
.noir.look .in{animation:nlook 2.4s ease-in-out}
@keyframes nlook{0%,100%{transform:rotate(0)}30%,45%{transform:rotate(-3deg) translateX(-2px)}65%,80%{transform:rotate(2.5deg) translateX(2px)}}
.noir.pat .in{animation:npat .5s cubic-bezier(.3,1.5,.6,1) 2}
@keyframes npat{0%,100%{transform:translateY(0) scale(1)}40%{transform:translateY(-10px) scale(1.02,.99)}}
.noir.lean .in{animation:nlean 3s ease-in-out infinite}
@keyframes nlean{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(-4.6deg) scale(1.006,1.012)}}
/* 동글동글(비교용): 게임과 같은 움직임 */
.round.walk .in{animation:rwalk .36s ease-in-out infinite alternate}@keyframes rwalk{from{transform:rotate(-5deg) translateY(0)}to{transform:rotate(5deg) translateY(-3px)}}
.round.run .in{animation:rwalk .18s ease-in-out infinite alternate}
.round.pat .in{animation:npat .5s cubic-bezier(.3,1.5,.6,1) 2}
.round.look .in{animation:nlook 1.8s ease-in-out}
.heart{position:absolute;left:50%;top:-4px;font-size:18px;color:#FF6F8B;animation:hrt .9s ease-out forwards;pointer-events:none}
@keyframes hrt{from{opacity:1;transform:translate(-50%,0)}to{opacity:0;transform:translate(-50%,-26px)}}
.bub{position:absolute;bottom:calc(100% + 6px);left:50%;transform:translateX(-50%);white-space:nowrap;padding:6px 10px;border-radius:12px;background:#FFF7E8;color:#1B1E24;font-size:12px;font-weight:800;box-shadow:0 4px 10px rgba(0,0,0,.35)}
.acts{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:10px}
.acts button{height:42px;border:0;border-radius:12px;background:var(--panel);color:var(--text);font:inherit;font-weight:700;font-size:14px;box-shadow:inset 0 0 0 1px var(--line)}
.acts button.on{box-shadow:inset 0 0 0 2px var(--acc);color:var(--acc)}
.note{margin-top:14px;padding:12px 14px;border-radius:14px;background:var(--panel);font-size:13px;line-height:1.6;color:var(--muted)}
.note b{color:var(--text)}
</style></head><body><div class="wrap">
<h1>상황실 누아르 파트너 시안</h1>
<p class="sub">알파카(현장 그림에서 오려 낸 모습)로 만든 시안이에요. 파트너를 누르면 쓰다듬기, 끌면 옮겨져요.</p>
<div class="seg" id="look"><button data-v="noir" class="on">누아르</button><button data-v="round">동글동글</button></div>
<div class="room" id="room"><div class="pet noir idle" id="pet"><div class="in"><div class="flip" id="art"></div><i class="shadow"></i></div></div></div>
<div class="label">누아르 크기</div>

var room=document.getElementById('room'), pet=document.getElementById('pet'), art=document.getElementById('art');
var look='noir', size=104, mode='auto', x=40, face=1, T=0;
function W(){return room.clientWidth}
function dims(){ if(look==='noir'){var h=size*W()/380; return {h:h,w:h*385/602}} var s=58*W()/380; return {h:s,w:s} }
function draw(){
  var d=dims(); pet.style.width=d.w+'px'; pet.style.height=d.h+'px';
  pet.querySelector('.in').style.height=d.h+'px';
  art.style.height=d.h+'px';
  art.innerHTML= look==='noir' ? '<img src="'+SPR+'" alt="누아르 알파카">' : RND;
  pet.className='pet '+look+' '+(pet.dataset.st||'idle')+(face<0?' left':'');
  place();
}
function place(){ var d=dims(); x=Math.max(2,Math.min(W()-d.w-2,x)); pet.style.left=x+'px' }
function st(s){ pet.dataset.st=s; pet.className='pet '+look+' '+s+(face<0?' left':'') }
function go(tx,speed,s,cb){ var d=dims(); tx=Math.max(2,Math.min(W()-d.w-2,tx)); var dist=Math.abs(tx-x), ms=Math.max(300,dist/speed*1000*(W()/380)); face=tx<x?-1:1; pet.style.transitionDuration=ms+'ms'; x=tx; pet.style.left=x+'px'; st(s); clearTimeout(T); T=setTimeout(cb,ms) }
function auto(){
  if(mode!=='auto') return;
  var r=Math.random(), d=dims();
  if(r<.32) go(Math.random()*(W()-d.w),55,'walk',function(){st('idle');T=setTimeout(auto,1400+Math.random()*1600)});
  else if(r<.45) go(Math.random()*(W()-d.w),150,'run',function(){st('idle');T=setTimeout(auto,1200)});
  else if(r<.62){st('look');T=setTimeout(function(){st('idle');auto()},2400)}
  else if(r<.75){st('lean');T=setTimeout(auto,3200)}
  else {st('idle');T=setTimeout(auto,2200+Math.random()*1500)}
}
function setMode(m){ mode=m; clearTimeout(T); pet.style.transitionDuration='0ms';
  [].forEach.call(document.querySelectorAll('#acts button'),function(b){b.classList.toggle('on',b.getAttribute('data-a')===m)});
  if(m==='auto'){auto();return}
  if(m==='walk'||m==='run'){ (function loop(){ var d=dims(), tx= face>0? W()-d.w-4 : 4; go(tx, m==='walk'?55:150, m, function(){ face=-face; loop() }) })(); return }
  st(m) }
function seg(id,cb){ document.getElementById(id).addEventListener('click',function(e){var b=e.target.closest('button');if(!b)return;[].forEach.call(this.children,function(c){c.classList.toggle('on',c===b)});cb(b.getAttribute('data-v'))}) }
seg('look',function(v){look=v;draw()}); seg('size',function(v){size=+v;draw()});
document.getElementById('acts').addEventListener('click',function(e){var b=e.target.closest('button'); if(b) setMode(b.getAttribute('data-a'))});
/* 쓰다듬기 · 끌어서 옮기기 */
var drag=null;
pet.addEventListener('pointerdown',function(e){ drag={sx:e.clientX,x0:x,moved:false}; pet.setPointerCapture(e.pointerId) });
pet.addEventListener('pointermove',function(e){ if(!drag)return; var dx=e.clientX-drag.sx; if(Math.abs(dx)>6){drag.moved=true; clearTimeout(T); pet.style.transitionDuration='0ms'; x=drag.x0+dx; place(); st('idle')} });
pet.addEventListener('pointerup',function(){ if(!drag)return; var m=drag.moved; drag=null; if(m){ if(mode==='auto') T=setTimeout(auto,1500); return }
  clearTimeout(T); st('pat'); var h=document.createElement('i'); h.className='heart'; h.textContent='♥'; pet.appendChild(h); setTimeout(function(){h.remove()},900);
  var bb=document.createElement('span'); bb.className='bub'; bb.textContent=['현장으로 가 볼까요','증거는 거짓말 안 해요','비가 그쳤네요'][Math.floor(Math.random()*3)]; var dd=dims(); if(x+dd.w/2>W()*0.6){bb.style.left='auto';bb.style.right='0';bb.style.transform='none'} else if(x+dd.w/2<W()*0.4){bb.style.left='0';bb.style.transform='none'} pet.appendChild(bb); setTimeout(function(){bb.remove()},1600);
  T=setTimeout(function(){ st('idle'); if(mode==='auto') auto(); else setMode(mode) },1000) });
window.addEventListener('resize',draw);
draw(); setMode('auto');
})();
