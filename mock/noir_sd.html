.of-pet.sit .of-pet-in{transform:scale(1.04,.94);transition:transform .3s}
@keyframes ofpwalk{from{transform:translateY(0) rotate(-3deg)}to{transform:translateY(-4px) rotate(3deg)}}

.seg{display:flex;gap:6px}
.seg button{flex:1;height:44px;border:0;border-radius:12px;background:var(--panel);color:var(--text);font:inherit;font-weight:800;font-size:14px}
.seg button.on{background:var(--acc);color:#1B1E24}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chips button{flex:0 0 auto;width:60px;border:2px solid transparent;border-radius:12px;background:var(--panel);color:var(--muted);font:inherit;font-size:11px;font-weight:700;padding:4px 2px 5px}
.chips button.on{border-color:var(--acc);color:var(--text)}
.chips svg{width:44px;height:44px;display:block;margin:0 auto}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:6px}
.cell{background:var(--panel);border-radius:12px;padding:4px 2px 6px;text-align:center;font-size:11px;font-weight:700;color:var(--muted)}
.cell svg{width:100%;aspect-ratio:1;display:block}
.cell b{display:block;color:var(--text);font-size:12px}
.pb-blink{animation:pbblink 4s infinite;transform-origin:center;transform-box:fill-box}
@keyframes pbblink{0%,94%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}

.pb-tilt{animation:pbtilt 1.6s ease-in-out infinite alternate;transform-box:view-box;transform-origin:100px 150px}

  /* ---------- 등급 꾸밈 ---------- */
  var GDEFS = '<defs>' +
    '<linearGradient id="gBronze" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#F2C08A"/><stop offset="1" stop-color="#B07034"/></linearGradient>' +

    '<linearGradient id="gCape" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#E5484F"/><stop offset="1" stop-color="#9E1F27"/></linearGradient>' +
    '<radialGradient id="gAura"><stop offset="0" stop-color="#FFE48A" stop-opacity=".95"/><stop offset=".6" stop-color="#FFD23F" stop-opacity=".45"/><stop offset="1" stop-color="#FFD23F" stop-opacity="0"/></radialGradient>' +
    '</defs>';
  // 머리 위에 눈이 달린 개구리는 모자를 이마(눈 사이 아래)로 작게
  var CAP_AT = {};   // (0.3.1) 개구리 경찰모는 이마가 아니라 두 눈 뒤에 — decorate 에서 뒤쪽에 그린다
  function cap(gold, id) {

  }
  // 0.12.5 경찰모를 다시 그렸다: 위가 부푼 모자 몸통 + 띠 + 반짝이는 챙 + 휘장(예전 것은 납작한 판 두 장이라 만들다 만 것처럼 보였다)
  function capInner(gold) {

    var pipe = gold ? '#FFF6D0' : '#E8B931', shine = gold ? '#FFFBE6' : '#6F86BC';
    var star = '<path d="M100 14 l3.6 7.2 7.9 1.1-5.7 5.6 1.3 7.9-7.1-3.7-7.1 3.7 1.3-7.9-5.7-5.6 7.9-1.1z"';
    return '<g transform="rotate(-8 100 36)">' +
      // 모자 몸통(위가 넓게 부풀고 띠 쪽으로 좁아진다)
      '<path d="M57 42 C50 22 74 6 100 6 C126 6 150 22 143 42 Q100 31 57 42 Z" fill="' + top + '" stroke="' + line + '" stroke-width="3.2" stroke-linejoin="round"/>' +
      '<path d="M68 20 Q100 6 132 20" stroke="' + shine + '" stroke-width="4" fill="none" stroke-linecap="round" opacity=".7"/>' +
      // 띠와 장식 줄
      '<path d="M62 40 Q100 30 138 40 L136 52 Q100 43 64 52 Z" fill="' + band + '" stroke="' + line + '" stroke-width="3" stroke-linejoin="round"/>' +
      '<path d="M65 45.5 Q100 36 135 45.5" stroke="' + pipe + '" stroke-width="2.2" fill="none" stroke-linecap="round"/>' +
      // 챙(반짝이는 줄 하나)
      '<path d="M60 52 Q100 42 140 52 Q138 63 100 64 Q62 63 60 52 Z" fill="' + visor + '" stroke="' + line + '" stroke-width="3" stroke-linejoin="round"/>' +
      '<path d="M72 55 Q100 49 128 55" stroke="#fff" stroke-width="2" fill="none" stroke-linecap="round" opacity=".35"/>' +
      // 휘장: 동그란 바탕 위 별
      '<circle cx="100" cy="24" r="12.5" fill="' + (gold ? '#FFF6D0' : '#1A2338') + '" stroke="' + (gold ? '#B8860B' : '#E8B931') + '" stroke-width="2.4"/>' +

  }

  function eyes(id) {

  }
  return { draw: draw, ids: Object.keys(DRAW), HATS: HATS, eyes: eyes };
});

<script>
(function(){
var A=window.Team3PetArt, SP=[["corgi", "단서", "웰시코기"], ["shiba", "보리", "시바견"], ["hamster", "도토리", "햄스터"], ["rabbit", "솜이", "토끼"], ["bear", "곰돌 반장", "곰"], ["hedgehog", "가시", "고슴도치"], ["duck", "뒤뚱", "오리"], ["frog", "풍덩", "개구리"], ["ragdoll", "알리", "랙돌"], ["siamese", "모카", "샴"], ["fox", "노을", "여우"], ["penguin", "펭경", "펭귄"], ["monkey", "망고", "원숭이"], ["squirrel", "도람", "다람쥐"], ["koala", "코코", "코알라"], ["raccoon", "몽이", "너구리"], ["owl", "새벽", "부엉이"], ["otter", "달수", "수달"], ["panda", "판돌", "판다"], ["tiger", "범수", "호랑이"], ["sheep", "뭉게", "양"], ["pig", "복돌", "돼지"], ["redpanda", "단풍", "레서판다"], ["alpaca", "파카", "알파카"], ["seal", "몽실", "물범"], ["hippo", "하하", "하마"], ["turtle", "엉금", "거북이"], ["mouse", "치즈", "생쥐"], ["lion", "갈기", "사자"], ["deer", "방울", "사슴"]], cur='corgi', nz='a';
var pet=document.getElementById('pet'), pin=document.getElementById('petin'), room=document.getElementById('room');
function draw(id,o){return A.draw(id,o)}
function paint(){
  pin.innerHTML=draw(cur,{grade:'c',anim:true,noir:nz||null});
  document.getElementById('grid').innerHTML=SP.map(function(x){return '<div class="cell">'+draw(x[0],{grade:'c',noir:nz||null})+'<b>'+x[1]+'</b>'+x[2]+'</div>'}).join('');
  [].forEach.call(document.querySelectorAll('#chips button'),function(b){b.classList.toggle('on',b.getAttribute('data-id')===cur)});
  [].forEach.call(document.querySelectorAll('#seg button'),function(b){b.classList.toggle('on',b.getAttribute('data-n')===nz)});
}
document.getElementById('chips').innerHTML=SP.map(function(x){return '<button data-id="'+x[0]+'">'+draw(x[0],{grade:'c'})+x[1]+'</button>'}).join('');

// 게임 사무실처럼: 걷다가 멈추고, 가끔 폴짝. 누르면 폴짝
var x=30,face=1,tm=null;
function setState(s){pet.className='of-pet '+s+(face<0?' flip':'')}
function hop(){clearTimeout(tm);setState('hop');tm=setTimeout(loop,1000)}
function loop(){
  var W=room.clientWidth-pet.offsetWidth-10, r=Math.random();
  if(r<0.6){var nx=Math.max(10,Math.min(W,10+Math.random()*W));face=nx<x?-1:1;x=nx;setState('walk');pet.style.left=x+'px';tm=setTimeout(function(){setState('sit');tm=setTimeout(loop,1500+Math.random()*1500)},2600)}
  else if(r<0.75){hop()}
  else{setState('sit');tm=setTimeout(loop,1800)}
}
pet.onclick=hop;
paint();setState('sit');tm=setTimeout(loop,800);
})();
</script></body></html>
