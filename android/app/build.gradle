plugins {
    id 'com.android.application'
}

/*
 * 서명 키
 *   - 같은 키로 서명한 APK 만 기존 앱 위에 덮어 설치된다. 키가 바뀌면 지우고 다시 깔아야 한다(기기 저장도 사라진다).
 *   - 정식 키(1.2부터): GitHub Secrets 의 KEYSTORE_B64(키 파일 base64) · KEYSTORE_PASSWORD 로만 서명한다.
 *     Actions 가 KEYSTORE_B64 를 파일로 풀어 KEYSTORE_FILE 경로를 넘긴다. 키 파일은 저장소에 없다(원본은 Guar 가 따로 보관).
 *   - 예전 알파 키(alpha.keystore)는 지웠다. 키나 비밀번호가 없으면 빌드를 멈춘다(실수로 다른 키로 나가지 않게).
 *   - 손으로 시험 빌드만 할 때는 ALLOW_DEBUG_SIGN=1 을 주면 디버그 키로 서명한다(이 APK 는 배포하지 않는다).
 */
def keystoreFile = System.getenv('KEYSTORE_FILE')
def keystorePassword = System.getenv('KEYSTORE_PASSWORD')
def debugSign = System.getenv('ALLOW_DEBUG_SIGN') == '1'
if (!debugSign && (!keystoreFile || !keystorePassword || !file(keystoreFile).exists())) {
    throw new GradleException('정식 서명 키가 없다: KEYSTORE_FILE / KEYSTORE_PASSWORD 를 주거나, 시험 빌드면 ALLOW_DEBUG_SIGN=1')
}

android {
    namespace 'io.github.eifv013.team3'
    compileSdk 35

    defaultConfig {
        applicationId 'io.github.eifv013.team3'
        minSdk 24            // 안드로이드 7.0 이상: 웹뷰가 서비스 워커(오프라인 열기)를 지원하는 최소선
        targetSdk 34         // 35 부터는 화면이 상태 표시줄 밑까지 깔리는 것이 강제된다. 게임 화면이 가려지지 않게 34 에 둔다.
        // 빌드할 때마다 1씩 오른다(GitHub Actions 의 실행 번호). 숫자가 커야 덮어 설치된다.
        versionCode((System.getenv('GITHUB_RUN_NUMBER') ?: '1') as int)
        versionName '1.2'   // 1.1: 뒤로 단추 두 번 눌러 끄기 · 1.2: 정식 서명 키(이전 판 위에 덮어 설치 안 됨 → 지우고 다시 설치)
        // 게임을 불러올 주소. 패치는 이 주소의 파일을 바꾸는 것으로 끝난다(APK 를 다시 만들 필요가 없다).
        buildConfigField 'String', 'GAME_URL', '"https://eifv013.github.io/Team3/"'
    }

    buildFeatures { buildConfig true }

    signingConfigs {
        if (!debugSign) {
            release {
                storeFile file(keystoreFile)
                storePassword keystorePassword
                keyAlias 'team3'
                keyPassword keystorePassword
            }
        }
    }

    buildTypes {
        release {
            signingConfig debugSign ? signingConfigs.debug : signingConfigs.release
            minifyEnabled false   // 코드가 파일 하나뿐이라 줄일 것이 없다
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
}

dependencies {
    testImplementation 'junit:junit:4.13.2'   // 단위 테스트(LinksTest)에만 쓴다. APK 에는 들어가지 않는다.
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'                // 한글 주석과 테스트 이름
}
