<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>수사 3팀 · 사건 3 시안 (①②③)</title>
<!--
  사건 3 후보 세 가지를 직접 해 보는 시안. 실제 게임에 넣기 전 "재미 · 난이도 · 느낌"을 고르는 용도.
    ① 가면무도회의 밤 — 그림자 맞추기: 스포트라이트 그림자(모양만 보임)와 맞는 용의자 1명
    ② 정전된 아파트   — 손전등 수색: 어두운 판에서 옷차림이 똑같은 두 명(공범)을 찾기, 번개가 칠 때만 전체가 보임
    ③ 막차의 소매치기 — 동선 추적: 노선도 단서 두 개에 모두 맞는 승차권(용의자) 1명
  공통: 60초, 맞히면 +점수 · 시간 +2초, 틀리면 −5초. 단계는 맞힌 수에 따라 1→2→3.
  문제 만들기는 makeShadow/makeTwins/makeRoute — 정답이 늘 하나(②는 짝이 늘 하나)인지 selfTest() 로 확인한다.
-->
<style>
:root{--bg:#141820;--panel:#1E2430;--panel2:#262E3D;--line:#343E52;--text:#EEF1F6;--muted:#97A1B3;--acc:#FFD23F}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:'IBM Plex Sans KR','Apple SD Gothic Neo','Noto Sans KR',sans-serif}
body{max-width:460px;margin:0 auto;padding:14px 14px 40px;display:flex;flex-direction:column;gap:12px;overflow-x:hidden}
h1{margin:0;font-size:24px}.label{font-size:12px;color:var(--muted);font-weight:600;letter-spacing:.02em}
.tabs{display:flex;gap:6px}.tabs button{flex:1;height:46px;border-radius:12px;border:1.5px solid var(--line);background:var(--panel);color:var(--muted);font:inherit;font-weight:700;font-size:13px}
.tabs button.on{border-color:var(--acc);color:var(--acc)}
.card{background:var(--panel);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:10px}
.card h2{margin:0;font-size:20px}.card p{margin:0;font-size:13.5px;line-height:1.55;color:#C9D0DC}
.lv{display:flex;gap:6px}.lv button{flex:1;height:36px;border-radius:10px;border:1.5px solid var(--line);background:none;color:var(--muted);font:inherit;font-weight:700;font-size:12px}.lv button.on{border-color:var(--acc);color:var(--acc)}
.hud{display:flex;justify-content:space-between;align-items:center;font-weight:700}
.hud .t{font-size:22px;font-variant-numeric:tabular-nums}.hud .t.low{color:#FF6B6B}.hud .s{color:var(--acc);font-size:18px}
.go{height:54px;border-radius:14px;border:0;background:var(--acc);color:#1B1E24;font:inherit;font-weight:800;font-size:17px}
.stage{position:relative;border-radius:16px;overflow:hidden;user-select:none;touch-action:none}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:10px;position:relative;z-index:2}
.sus{position:relative;aspect-ratio:3/4;border-radius:12px;border:2px solid transparent;background:#F3E9D6;padding:0;display:flex;align-items:flex-end;justify-content:center;overflow:hidden}
.sus svg{width:100%;height:100%}
.sus.ok{border-color:#3DDC84;box-shadow:0 0 16px #3DDC84}.sus.bad{border-color:#FF6B6B;animation:shake .3s}
@keyframes shake{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
.msg{min-height:22px;text-align:center;font-weight:700;font-size:14px}
.end{display:flex;flex-direction:column;align-items:center;gap:8px;padding:18px;text-align:center}
.end b{font-size:40px;color:var(--acc)}

/* ① 무도회: 샹들리에 빛 · 스포트라이트 · 그림자 */
.ball{background:radial-gradient(ellipse at 50% -10%,rgba(255,226,150,.45),transparent 55%),linear-gradient(180deg,#3A1C3E,#1D1028)}
.ball .chand{position:absolute;left:50%;top:-6px;width:120px;height:40px;margin-left:-60px;z-index:1;
  background:radial-gradient(circle at 50% 0,#FFE9A8 0 10px,transparent 11px),repeating-linear-gradient(90deg,transparent 0 10px,rgba(255,233,168,.5) 10px 12px);opacity:.8;border-radius:0 0 60px 60px}
.spot{position:relative;z-index:2;margin:28px auto 0;width:170px;height:190px;border-radius:50%;
  background:radial-gradient(ellipse at 50% 55%,rgba(255,244,214,.95),rgba(255,236,180,.55) 45%,rgba(255,236,180,0) 70%);display:flex;align-items:flex-end;justify-content:center}
.spot svg{width:120px;height:160px;filter:blur(.6px)}
.spot.half{clip-path:polygon(0 0,100% 0,100% 55%,0 55%)}
.beam{position:absolute;left:50%;top:-30px;width:260px;height:260px;margin-left:-130px;z-index:1;pointer-events:none;
  background:conic-gradient(from 160deg at 50% 0,transparent 0deg,rgba(255,240,200,.18) 14deg,rgba(255,240,200,.18) 26deg,transparent 40deg);animation:sweep 4s ease-in-out infinite alternate}
@keyframes sweep{from{transform:rotate(-14deg)}to{transform:rotate(14deg)}}
.ball .grid .sus{background:#F6EEDF}

/* ② 정전: 어둠 + 손전등 + 번개 */
.dark{background:#0B0E14;min-height:420px}
.dark .grid{grid-template-columns:repeat(4,1fr)}
.dark .shade{position:absolute;inset:0;z-index:3;pointer-events:none;background:radial-gradient(circle var(--r,70px) at var(--x,50%) var(--y,50%),rgba(0,0,0,0) 0,rgba(0,0,0,.25) 60%,rgba(4,6,10,.97) 100%)}
.dark.flash .shade{animation:lightning .5s ease-out}
@keyframes lightning{0%,30%{opacity:0}31%{opacity:1}45%{opacity:0}100%{opacity:1}}
.dark .rain{position:absolute;inset:0;z-index:4;pointer-events:none;opacity:.25;background:repeating-linear-gradient(105deg,transparent 0 14px,rgba(160,190,230,.35) 14px 15px);animation:rain .5s linear infinite}
@keyframes rain{to{background-position:-30px 60px}}
.dark .sus.pick{border-color:var(--acc)}

/* ③ 지하철: 노선도 · 승차권 · 터널 조명 */
.metro{background:linear-gradient(180deg,#1A2333,#121823)}
.metro .tunnel{position:absolute;inset:0;z-index:0;opacity:.35;background:repeating-linear-gradient(90deg,transparent 0 80px,rgba(255,214,120,.5) 80px 86px,transparent 86px 160px);animation:tunnel 1.1s linear infinite}
@keyframes tunnel{to{background-position:-160px 0}}
.line{position:relative;z-index:2;margin:12px 10px 4px;display:flex;justify-content:space-between;align-items:center}
.line::before{content:'';position:absolute;left:10px;right:10px;top:9px;height:6px;border-radius:3px;background:#3FB46A}
.st{position:relative;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:10.5px;color:#C9D0DC;width:48px}
.st i{width:24px;height:24px;border-radius:50%;background:#fff;border:5px solid #3FB46A}.st.x i{border-color:#F08A3C}
.clues{position:relative;z-index:2;margin:6px 10px 0;display:flex;flex-direction:column;gap:6px}
.clue{padding:8px 10px;border-radius:10px;background:rgba(255,210,63,.12);border:1px solid rgba(255,210,63,.45);font-size:13px;font-weight:700}
.metro .grid .sus{aspect-ratio:auto;background:#F7F2E6;color:#1B1E24;flex-direction:column;align-items:stretch;justify-content:flex-start;padding:8px 8px 6px;gap:4px;min-height:96px}
.tk{font-size:10px;color:#6B7280;font-weight:700}.tk-r{font-size:15px;font-weight:800;line-height:1.2}.tk-m{font-size:11px;color:#4B5563;white-space:nowrap}
.sway{animation:trainsway 2.4s ease-in-out infinite}
@keyframes trainsway{0%,100%{transform:translateX(0)}50%{transform:translateX(2px) rotate(.2deg)}}
.note{font-size:12px;color:var(--muted);line-height:1.5}
@media (prefers-reduced-motion:reduce){*{animation:none !important}}
</style>
</head>
<body>
<span class="label">사건 3 후보 · 직접 해 보는 시안</span>
<h1>어느 사건이 제일 재밌나요?</h1>
<div class="tabs" id="tabs">
  <button data-m="shadow" class="on">① 가면무도회</button><button data-m="twins">② 정전 아파트</button><button data-m="route">③ 막차 소매치기</button>
</div>
<div class="card" id="intro"></div>
<div class="lv" id="lv"><button data-l="1" class="on">1단계부터</button><button data-l="2">2단계부터</button><button data-l="3">3단계부터</button></div>
<div class="hud"><span class="t" id="t">60.0</span><span id="lvl">단계 1</span><span class="s" id="score">0</span></div>
<div class="stage" id="stage"></div>
<div class="msg" id="msg"></div>
<button class="go" id="go">시작</button>
<p class="note">시안이라 소리 · 동물 · 보상은 빠져 있어요. 판의 재미와 난이도, 화면 느낌만 봐 주세요. 맞히면 +2초, 틀리면 −5초예요.</p>

<script>
'use strict';
/* ---------- 공용 ---------- */
var rand = Math.random;
function ri(n) { return Math.floor(rand() * n); }
function shuffle(a) { for (var i = a.length - 1; i > 0; i--) { var j = ri(i + 1), t = a[i]; a[i] = a[j]; a[j] = t; } return a; }
function $(id) { return document.getElementById(id); }

/*
 * 용의자 그림: 특징 { hat 0~2(없음·실크해트·베레모), build 0~1(마름·통통), item 0~2(없음·지팡이·가방), hair 0~1(짧음·묶음), coat 0~2(색) }
 * shadow=true 면 모양만 까맣게(색은 안 보임) — ① 그림자.
 */
var COATS = ['#C0392B', '#2E6FB7', '#2E8B57'];
function figure(f, shadow) {
  var ink = shadow ? '#120A16' : '#2A1E1A', coat = shadow ? '#120A16' : COATS[f.coat], skin = shadow ? '#120A16' : '#F6D5B8';
  var w = f.build ? 34 : 24, s = '<svg viewBox="0 0 120 160" aria-hidden="true">';
  if (!shadow) s += '<ellipse cx="60" cy="154" rx="34" ry="5" fill="rgba(0,0,0,.18)"/>';
  // 몸 · 다리
  s += '<path d="M' + (60 - w) + ' 152 q-2-46 ' + w + '-56 q' + w + ' 10 ' + w + ' 56z" fill="' + coat + '" stroke="' + ink + '" stroke-width="3"/>';
  // 묶은 머리(뒤)
  if (f.hair) s += '<ellipse cx="84" cy="62" rx="9" ry="13" fill="' + (shadow ? ink : '#4A2C1A') + '"/>';
  // 머리
  s += '<circle cx="60" cy="62" r="22" fill="' + skin + '" stroke="' + ink + '" stroke-width="3"/>';
  if (!shadow) s += '<path d="M40 56 q20-24 40 0" fill="#4A2C1A"/><circle cx="52" cy="64" r="2.6" fill="#2A1E1A"/><circle cx="68" cy="64" r="2.6" fill="#2A1E1A"/><path d="M54 74 q6 4 12 0" stroke="#2A1E1A" stroke-width="2" fill="none"/>';
  // 모자
  if (f.hat === 1) s += '<rect x="44" y="22" width="32" height="26" fill="' + (shadow ? ink : '#1B1E24') + '"/><rect x="34" y="44" width="52" height="6" rx="3" fill="' + (shadow ? ink : '#1B1E24') + '"/>';
  if (f.hat === 2) s += '<ellipse cx="62" cy="42" rx="26" ry="10" fill="' + (shadow ? ink : '#8E44AD') + '"/><circle cx="62" cy="33" r="3" fill="' + (shadow ? ink : '#8E44AD') + '"/>';
  // 소품
  if (f.item === 1) s += '<path d="M' + (60 + w + 6) + ' 100 v52 M' + (60 + w + 6) + ' 100 q0-8 -8-8" stroke="' + (shadow ? ink : '#6E4E36') + '" stroke-width="4" fill="none" stroke-linecap="round"/>';
  if (f.item === 2) s += '<rect x="' + (60 - w - 18) + '" y="112" width="20" height="18" rx="3" fill="' + (shadow ? ink : '#D4A017') + '" stroke="' + ink + '" stroke-width="2"/><path d="M' + (60 - w - 14) + ' 112 q6-8 12 0" stroke="' + ink + '" stroke-width="2" fill="none"/>';
  return s + '</svg>';
}
function sameShape(a, b, keys) { return keys.every(function (k) { return a[k] === b[k]; }); }
function randFig() { return { hat: ri(3), build: ri(2), item: ri(3), hair: ri(2), coat: ri(3) }; }

/*
 * ① 그림자 맞추기. 단계 1: 모양 3가지(모자 · 체형 · 소품), 2: 4가지(+ 머리), 3: 4가지 + 그림자 위쪽만 보임(머리 · 모자만).
 *   정답 1명 + 나머지는 모양 특징 중 정확히 하나만 다른 "닮은 사람"을 섞는다 → 늘 정답이 하나.
 *   단계 3에서 보이는 특징만으로도 정답이 하나가 되게(보이는 특징 기준으로 같은 사람은 정답뿐).
 */
function makeShadow(level) {
  var keys = level === 1 ? ['hat', 'build', 'item'] : ['hat', 'build', 'item', 'hair'];
  var seen = level === 3 ? ['hat', 'hair'] : keys;   // 단계 3: 그림자 위쪽만
  var ans = randFig(), cards = [ans], tries = 0;
  while (cards.length < 9 && tries++ < 500) {
    var c = Object.assign({}, ans), k = seen[ri(seen.length)], max = { hat: 3, build: 2, item: 3, hair: 2 }[k];
    c[k] = (c[k] + 1 + ri(max - 1)) % max;
    if (ri(2)) { var k2 = keys[ri(keys.length)], m2 = { hat: 3, build: 2, item: 3, hair: 2 }[k2]; if (seen.indexOf(k2) < 0) c[k2] = ri(m2); }
    c.coat = ri(3);
    if (sameShape(c, ans, seen)) continue;
    cards.push(c);
  }
  return { ans: ans, cards: shuffle(cards), keys: keys, seen: seen, half: level === 3 };
}

/*
 * ② 정전 아파트: 12명 중 옷차림(모자 · 소품 · 코트 색 · 머리)이 똑같은 두 명(공범)을 찾는다. 짝은 늘 하나.
 *   단계가 오르면 손전등이 작아지고(1: 78px, 2: 62px, 3: 50px), 번개 간격이 길어진다.
 */
function sig(f) { return [f.hat, f.item, f.coat, f.hair].join(''); }
function makeTwins() {
  var all = [];
  for (var h = 0; h < 3; h++) for (var it = 0; it < 3; it++) for (var c = 0; c < 3; c++) for (var hr = 0; hr < 2; hr++) all.push({ hat: h, item: it, coat: c, hair: hr, build: ri(2) });
  shuffle(all);
  var cards = all.slice(0, 11), twin = Object.assign({}, cards[0]);
  twin.build = ri(2);
  cards.push(twin);
  return { cards: shuffle(cards) };
}
function pairsOf(cards) {
  var n = 0;
  for (var i = 0; i < cards.length; i++) for (var j = i + 1; j < cards.length; j++) if (sig(cards[i]) === sig(cards[j])) n++;
  return n;
}

/*
 * ③ 막차의 소매치기: 6개 역 한 줄 노선. 승차권 = { from, to, time(분) }.
 *   단서 두 개(서로 다른 종류)에 모두 맞는 사람은 정답 1명, 나머지는 하나만 맞거나 둘 다 틀린다.
 */
var STATIONS = ['해무', '중앙', '시장', '대학', '공원', '종점'];
var TIMES = [10, 20, 30, 40];
var CLUES = [
  { id: 'up', text: '종점 쪽으로 갔다', ok: function (t) { return t.to > t.from; } },
  { id: 'down', text: '해무 쪽으로 갔다', ok: function (t) { return t.to < t.from; } },
  { id: 'long', text: '3정거장 이상 탔다', ok: function (t) { return Math.abs(t.to - t.from) >= 3; } },
  { id: 'short', text: '2정거장 이하만 탔다', ok: function (t) { return Math.abs(t.to - t.from) <= 2; } },
  { id: 'mid', text: '시장역을 지나갔다(타고 내린 건 아님)', ok: function (t) { var a = Math.min(t.from, t.to), b = Math.max(t.from, t.to); return a < 2 && b > 2; } },
  { id: 'late', text: '11시 30분 이후에 탔다', ok: function (t) { return t.time >= 30; } },
  { id: 'early', text: '11시 30분 전에 탔다', ok: function (t) { return t.time < 30; } },
  { id: 'center', text: '중앙역에서 탔거나 내렸다', ok: function (t) { return t.from === 1 || t.to === 1; } }
];
var OPP = { up: 'down', down: 'up', long: 'short', short: 'long', late: 'early', early: 'late' };
function randTicket() { var a = ri(6), b = ri(5); if (b >= a) b++; return { from: a, to: b, time: TIMES[ri(4)] }; }
function makeRoute(level) {
  var n = level === 1 ? 6 : 9, tries = 0;
  for (;;) {
    if (tries++ > 2000) throw new Error('route gen');
    var c1 = CLUES[ri(CLUES.length)], c2 = CLUES[ri(CLUES.length)];
    if (c1.id === c2.id || OPP[c1.id] === c2.id) continue;
    var ok = function (t) { return c1.ok(t) && c2.ok(t); }, ans = null, cards = [], g = 0;
    while (!ans && g++ < 200) { var t = randTicket(); if (ok(t)) ans = t; }
    if (!ans) continue;
    cards.push(ans);
    // 함정: 단서 하나만 맞는 사람을 많이(단계가 오를수록 더)
    var g2 = 0;
    while (cards.length < n && g2++ < 400) {
      var x = randTicket();
      if (ok(x)) continue;
      var one = c1.ok(x) || c2.ok(x);
      if (!one && ri(level === 1 ? 2 : 4)) continue;
      cards.push(x);
    }
    if (cards.length < n) continue;
    return { clues: [c1, c2], cards: shuffle(cards), ans: ans };
  }
}
function fmtTime(m) { return '11:' + (m < 10 ? '0' : '') + m; }

/* ---------- 정답 하나 확인(시안 열 때 자동, 콘솔에 결과) ---------- */
function selfTest() {
  var bad = 0;
  for (var i = 0; i < 3000; i++) {
    var lv = 1 + (i % 3), q = makeShadow(lv);
    if (q.cards.length !== 9 || q.cards.filter(function (c) { return sameShape(c, q.ans, q.seen); }).length !== 1) bad++;
    var w = makeTwins();
    if (pairsOf(w.cards) !== 1) bad++;
    var r = makeRoute(lv);
    if (r.cards.filter(function (t) { return r.clues[0].ok(t) && r.clues[1].ok(t); }).length !== 1) bad++;
  }
  return bad;
}
window.__selfTest = selfTest;

/* ---------- 놀이 ---------- */
var mode = 'shadow', startLv = 1, game = null;
var INTRO = {
  shadow: '<span class="label">① 가면무도회의 밤 · 호텔 갈라쇼 보석 도난</span><h2>그림자 맞추기</h2><p>스포트라이트에 범인의 <b>그림자</b>가 비쳐요. 그림자에는 색이 안 보이고 <b>모양</b>(모자 · 체형 · 소품, 2단계부터 머리 모양)만 보여요. 9명 중 그림자와 모양이 꼭 맞는 사람을 고르세요. 3단계는 그림자 위쪽만 보여요.</p>',
  twins: '<span class="label">② 정전된 아파트 · 연쇄 빈집털이</span><h2>손전등 수색</h2><p>정전! 화면을 <b>끌면 손전등</b>이 비춰요. 12명 중 <b>옷차림이 똑같은 두 명</b>(모자 · 소품 · 코트 색 · 머리)이 공범이에요. 두 명을 차례로 누르세요. 가끔 <b>번개</b>가 치면 잠깐 전체가 보여요. 단계가 오르면 손전등이 작아져요.</p>',
  route: '<span class="label">③ 막차의 소매치기 · 지하철 일당</span><h2>동선 추적</h2><p>목격 단서 <b>두 개</b>가 나와요. 승차권(타는 역 → 내리는 역 · 탄 시각)을 보고 <b>두 단서에 모두 맞는</b> 승객을 고르세요. 단서 하나만 맞는 함정 승객이 섞여 있어요. 2단계부터 승객이 9명이에요.</p>'
};
function setMode(m) {
  mode = m;
  document.querySelectorAll('#tabs button').forEach(function (b) { b.classList.toggle('on', b.dataset.m === m); });
  $('intro').innerHTML = INTRO[m];
  stop(); preview();
}
function levelOf(g) { return Math.min(3, startLv + (g.hits >= 8 ? 2 : g.hits >= 3 ? 1 : 0)); }

function preview() {
  // 시작 전에도 판 모양을 보여 준다
  game = { hits: 0, score: 0, left: 60, over: true };
  newQ(true);
  $('t').textContent = '60.0'; $('t').classList.remove('low'); $('score').textContent = '0'; $('lvl').textContent = '단계 ' + startLv;
  $('msg').textContent = ''; $('go').textContent = '시작';
}
function newQ(still) {
  var lv = levelOf(game), st = $('stage');
  $('lvl').textContent = '단계 ' + lv;
  if (mode === 'shadow') {
    var q = game.q = makeShadow(lv);
    st.className = 'stage ball';
    st.innerHTML = '<div class="chand"></div><div class="beam"></div><div class="spot' + (q.half ? ' half' : '') + '">' + figure(q.ans, true) + '</div>' +
      '<div class="grid">' + q.cards.map(function (c, i) { return '<button class="sus" data-i="' + i + '">' + figure(c) + '</button>'; }).join('') + '</div>';
  } else if (mode === 'twins') {
    var w = game.q = makeTwins();
    game.pick = -1;
    st.className = 'stage dark';
    st.innerHTML = '<div class="grid">' + w.cards.map(function (c, i) { return '<button class="sus" data-i="' + i + '">' + figure(c) + '</button>'; }).join('') + '</div><div class="shade" id="shade"></div><div class="rain"></div>';
    st.style.setProperty('--r', ({ 1: 80, 2: 64, 3: 52 })[lv] + 'px');
  } else {
    var r = game.q = makeRoute(lv);
    st.className = 'stage metro';
    st.innerHTML = '<div class="tunnel"></div><div class="line">' + STATIONS.map(function (n, i) { return '<span class="st' + (i === 2 ? ' x' : '') + '"><i></i>' + n + '</span>'; }).join('') + '</div>' +
      '<div class="clues">' + r.clues.map(function (c) { return '<div class="clue">🔎 ' + c.text + '</div>'; }).join('') + '</div>' +
      '<div class="grid sway">' + r.cards.map(function (t, i) { return '<button class="sus" data-i="' + i + '"><span class="tk">승차권 #' + (101 + i) + '</span><span class="tk-r">' + STATIONS[t.from] + ' → ' + STATIONS[t.to] + '</span><span class="tk-m">' + fmtTime(t.time) + ' 승차</span><span class="tk-m">' + Math.abs(t.to - t.from) + '정거장</span></button>'; }).join('') + '</div>';
  }
}
function judge(i, el) {
  if (!game || game.over) return;
  var right;
  if (mode === 'shadow') right = sameShape(game.q.cards[i], game.q.ans, game.q.seen);
  else if (mode === 'route') { var t = game.q.cards[i]; right = game.q.clues[0].ok(t) && game.q.clues[1].ok(t); }
  else {
    if (game.pick < 0) { game.pick = i; el.classList.add('pick'); return; }
    if (game.pick === i) { el.classList.remove('pick'); game.pick = -1; return; }
    right = sig(game.q.cards[i]) === sig(game.q.cards[game.pick]);
    if (!right) { var p = document.querySelector('.sus[data-i="' + game.pick + '"]'); if (p) p.classList.remove('pick'); game.pick = -1; }
  }
  if (right) {
    el.classList.add('ok');
    game.hits++; game.score += 100 * levelOf(game); game.left += 2;
    $('msg').textContent = ['검거!', '잡았다!', '정확해요!'][ri(3)];
    $('score').textContent = game.score;
    game.lock = true;
    setTimeout(function () { game.lock = false; if (!game.over) newQ(); }, 380);
  } else {
    el.classList.add('bad'); game.left -= 5;
    $('msg').textContent = mode === 'twins' ? '옷차림이 달라요 (−5초)' : '아니에요 (−5초)';
    setTimeout(function () { el.classList.remove('bad'); }, 320);
  }
}
var timer = null, flashT = null;
function start() {
  stop();
  game = { hits: 0, score: 0, left: 60, over: false, last: performance.now() };
  newQ();
  $('go').textContent = '다시 시작'; $('msg').textContent = '';
  timer = setInterval(tick, 100);
  if (mode === 'twins') flashLoop();
}
function flashLoop() {
  clearTimeout(flashT);
  var lv = levelOf(game);
  flashT = setTimeout(function () {
    if (!game || game.over) return;
    var st = $('stage'); st.classList.remove('flash'); void st.offsetWidth; st.classList.add('flash');
    flashLoop();
  }, ({ 1: 5000, 2: 7000, 3: 9000 })[lv]);
}
function tick() {
  var now = performance.now(); game.left -= (now - game.last) / 1000; game.last = now;
  $('t').textContent = Math.max(0, game.left).toFixed(1);
  $('t').classList.toggle('low', game.left < 10);
  if (game.left <= 0) {
    game.over = true; stop();
    $('stage').innerHTML = '<div class="end"><span class="label">출동 종료</span><b>' + game.score + '</b><span>검거 ' + game.hits + '명 · 최고 단계 ' + levelOf(game) + '</span></div>';
    $('stage').className = 'stage';
  }
}
function stop() { clearInterval(timer); clearTimeout(flashT); timer = null; }

$('tabs').onclick = function (e) { var b = e.target.closest('button'); if (b) setMode(b.dataset.m); };
$('lv').onclick = function (e) {
  var b = e.target.closest('button'); if (!b) return;
  startLv = +b.dataset.l;
  document.querySelectorAll('#lv button').forEach(function (x) { x.classList.toggle('on', x === b); });
  if (!game || game.over) preview();
};
$('go').onclick = start;
$('stage').addEventListener('click', function (e) {
  var b = e.target.closest('.sus'); if (!b || game.over || game.lock) return;
  judge(+b.dataset.i, b);
});
// 손전등: 끌거나 움직이는 곳을 비춘다
function torch(e) {
  if (mode !== 'twins') return;
  var st = $('stage'), r = st.getBoundingClientRect(), p = e.touches ? e.touches[0] : e;
  st.style.setProperty('--x', (p.clientX - r.left) + 'px'); st.style.setProperty('--y', (p.clientY - r.top) + 'px');
}
$('stage').addEventListener('pointermove', torch);
$('stage').addEventListener('pointerdown', torch);
setMode('shadow');
</script>
</body>
</html>
