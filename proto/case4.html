<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>수사 3팀 사건 4 시안</title>
<!--
  사건 4 후보를 직접 해 보는 시안(2차). 카드는 게임과 같은 용의자 카드(시간대, 모자, 얼굴, 흔적)를 그대로 쓴다(ui.js 그리기 함수).
    ① 몽타주 맞히기 — 용의자를 대조하면 특징마다 맞음/틀림이 나온다. 적게 대조하고 범인을 맞힌다(참고: Wordle, 숫자야구)
    ② 신분증 검사   — 1차에서 남긴 후보. 사진과 신분증을 대조해 통과/체포(참고: Papers, Please)
    ③ 변장 추적     — 범인은 한 번에 하나씩만 바꿔 입었다. 첫 모습에서 하나만 다른 사람을 따라가 지금 모습까지(참고: 단어 사다리)
    ④ 잠복 수색     — 문을 열면 둘레 문 뒤에 숨은 범인 수가 나온다. 범인 문은 모두 체포(참고: 지뢰찾기)
  1차의 심문, CCTV 비교는 뺐다.
  공통: 60초, 맞히면 점수와 시간 +, 틀리면 −5초. 4번 맞힐 때마다 단계 1→2→3.
  문제 만들기 makeGuess / makeId / makeLadder / makeMine 은 정답이 늘 하나인지 selfTest() 로 확인한다.
-->
<style>
:root{--ink:#12151C;--panel:#1C212B;--panel2:#232937;--line:#2E3542;--text:#F3F0E8;--muted:#A3ACBA;--acc:#FFD23F;--miss:#FF7A59;--ok:#7BD88F}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--ink);color:var(--text);font-family:'IBM Plex Sans KR','Apple SD Gothic Neo','Noto Sans KR',sans-serif;word-break:keep-all}
body{max-width:460px;margin:0 auto;padding:14px 14px calc(env(safe-area-inset-bottom,0px) + 40px);display:flex;flex-direction:column;gap:12px;overflow-x:hidden}
h1{margin:0;font-size:22px}
.tabs{display:flex;gap:6px}.tabs button{white-space:nowrap;padding:0 4px}.tabs button{flex:1;height:46px;border-radius:12px;border:1.5px solid var(--line);background:var(--panel);color:var(--muted);font:inherit;font-weight:800;font-size:14px}
.tabs button.on{border-color:var(--acc);color:var(--acc)}
.box{background:var(--panel);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:10px}
.box h2{margin:0;font-size:19px}
.rule{margin:0;padding-left:18px;font-size:13.5px;line-height:1.6;color:#C9D0DC}
.ref{font-size:12px;color:var(--muted)}
.lv{display:flex;gap:6px}.lv button{flex:1;height:38px;border-radius:10px;border:1.5px solid var(--line);background:none;color:var(--muted);font:inherit;font-weight:800;font-size:13px}.lv button.on{border-color:var(--acc);color:var(--acc)}
.go{height:54px;border-radius:14px;border:0;background:var(--acc);color:#1B1E24;font:inherit;font-weight:900;font-size:17px}
.hud{display:flex;justify-content:space-between;align-items:center;font-weight:800}
.hud .t{font-size:24px;font-variant-numeric:tabular-nums}.hud .t.low{color:var(--miss)}
.hud .s{color:var(--acc);font-size:19px;font-variant-numeric:tabular-nums}
.hud .st{font-size:12px;color:var(--muted);border:1.5px solid var(--line);border-radius:999px;padding:3px 10px}
.msg{min-height:22px;text-align:center;font-weight:800;font-size:14px}
.msg.ok{color:var(--ok)}.msg.bad{color:var(--miss)}
.toast{position:fixed;left:50%;top:22%;transform:translate(-50%,-10px);z-index:20;background:var(--acc);color:#1B1E24;font-weight:900;padding:10px 18px;border-radius:999px;opacity:0;pointer-events:none;transition:opacity .25s,transform .25s}
.toast.on{opacity:1;transform:translate(-50%,0)}
.end{display:flex;flex-direction:column;align-items:center;gap:6px;padding:18px;text-align:center}
.end b{font-size:42px;color:var(--acc)}
/* 게임 카드(template.html 과 같은 모양) */
.card{position:relative;aspect-ratio:4/5;padding:0;border:0;border-radius:12px;overflow:hidden;transition:transform .12s,opacity .2s,filter .2s;box-shadow:inset 0 0 0 1px rgba(255,255,255,.06);font:inherit;color:inherit}
.card svg{display:block}
.card .t{position:absolute;top:6px;left:6px;width:28px;height:28px;border-radius:14px;display:flex;align-items:center;justify-content:center}
.card .m{position:absolute;bottom:6px;right:6px;width:28px;height:28px;border-radius:14px;display:flex;align-items:center;justify-content:center;z-index:1}
.card .fig{position:absolute;left:50%;bottom:0;width:84%;transform:translateX(-50%)}
.card .pick,.card .no{display:none}
.card.out{opacity:.22;filter:grayscale(1)}
.card.right{box-shadow:0 0 0 4px var(--ok)}
.card.wrong{box-shadow:0 0 0 4px var(--miss);animation:shake .4s}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.grid{display:grid;gap:8px}
.g3{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(4,1fr)}
.g4 .card .t,.g4 .card .m{width:22px;height:22px}.g4 .card .t svg,.g4 .card .m svg{width:15px;height:15px}

/* ① 몽타주 맞히기 */
.room{background:linear-gradient(180deg,#232A38,#191E28);border-radius:16px;padding:10px;display:flex;flex-direction:column;gap:10px}
.room .card{aspect-ratio:1/1}.room .card .fig{width:70%}
.mtg{display:flex;align-items:center;gap:10px;background:#EFE7D4;color:#2A2118;border-radius:10px;padding:8px 10px}
.mtg-q{width:40px;height:40px;border-radius:8px;background:#2A2118;color:#EFE7D4;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:22px}
.mtg-t{font-weight:900;font-size:15px;flex:1}.mtg-n{font-size:12px;font-weight:800;color:#6B5A40}
.hist{display:flex;flex-direction:column;gap:5px;min-height:44px}
.trow{display:flex;gap:5px;align-items:center}
.card.mini{width:40px;flex:0 0 auto;aspect-ratio:1/1;border-radius:8px}.card.mini .t,.card.mini .m{display:none}.card.mini .fig{width:80%}
.tile{flex:1;min-width:0;border-radius:8px;padding:3px 4px;text-align:center;font-size:10px;font-weight:800;line-height:1.25}
.tile b{display:block;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile.g{background:#2E7D4F;color:#E8FFEF}.tile.x{background:#3A4150;color:#B8C0CC}
.cnt{flex:1;height:40px;border-radius:8px;background:#3A4150;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:15px}
/* ③ 변장 추적 */
.trail{display:flex;align-items:center;gap:3px;min-height:44px;flex-wrap:nowrap;overflow:hidden}
.trail .arr{font-style:normal;color:var(--muted);font-weight:900}
.trail .card.mini.now{box-shadow:0 0 0 3px var(--acc)}
.trail .left{margin-left:auto;font-size:12px;font-weight:800;color:var(--muted);white-space:nowrap}
.card.cur{box-shadow:inset 0 0 0 4px var(--acc);opacity:1;filter:none}
/* ④ 잠복 수색 */
.apt{background:linear-gradient(180deg,#2A2F3C,#1B1F28);border-radius:16px;padding:10px;display:flex;flex-direction:column;gap:10px}
.apt-hd{display:flex;justify-content:space-between;font-weight:900;font-size:14px}.apt-hd span:last-child{color:var(--acc)}
.doors{display:grid;gap:6px}
.door{position:relative;aspect-ratio:1/1;border:0;border-radius:8px;background:linear-gradient(180deg,#6B4C38,#553A2A);box-shadow:inset 0 0 0 2px #3A2618,inset -10px 0 0 rgba(0,0,0,.12);font:inherit;color:#fff;padding:0;overflow:hidden}
.door:after{content:'';position:absolute;right:16%;top:52%;width:6px;height:6px;border-radius:50%;background:#E2B44A}
.door.open{background:#E9E3D6;box-shadow:inset 0 0 0 1px #C9C0AE}.door.open:after,.door.got:after,.door.lost:after{display:none}
.door b{font-size:20px;font-weight:900}
.door.n1 b{color:#2F6FD0}.door.n2 b{color:#2E8B4F}.door.n3 b{color:#C0392B}.door.n4 b,.door.n5 b{color:#6A2C91}
.door.got{background:#F4EFE2;box-shadow:0 0 0 3px var(--ok)}.door.lost{background:#F4EFE2;box-shadow:0 0 0 3px var(--miss);opacity:.55}
.door .fig{position:absolute;left:50%;bottom:0;width:84%;transform:translateX(-50%)}.door .t,.door .m,.door .pick,.door .no{display:none}
.door em{position:absolute;left:0;right:0;top:2px;font-style:normal;font-size:10px;font-weight:900;color:#2E7D4F}
.modes{display:flex;gap:8px}
.modes button{flex:1;height:48px;border-radius:12px;border:1.5px solid var(--line);background:var(--panel2);color:var(--muted);font:inherit;font-weight:900;font-size:16px}
.modes button.on{border-color:var(--acc);color:#1B1E24;background:var(--acc)}
.modes button.arrest.on{background:#C0392B;border-color:#C0392B;color:#fff}

/* ② 신분증 */
.desk{background:linear-gradient(180deg,#3A2E24,#2A211A);border-radius:16px;padding:12px;display:flex;flex-direction:column;gap:10px;overflow:hidden}
.pair{display:flex;gap:10px;align-items:stretch;animation:slidein .28s cubic-bezier(.2,1.2,.4,1)}
@keyframes slidein{from{transform:translateX(40px);opacity:0}to{transform:none;opacity:1}}
.pair .card{width:42%;flex:0 0 auto;align-self:center}
.idc{flex:1;background:#EFE7D4;color:#2A2118;border-radius:10px;padding:10px 10px 8px;box-shadow:0 4px 0 #B9AA8A;display:flex;flex-direction:column;gap:6px}
.idc .hd{display:flex;justify-content:space-between;font-size:11px;font-weight:900;letter-spacing:1px;color:#6B5A40;border-bottom:1.5px dashed #B9AA8A;padding-bottom:5px}
.idc .row{display:flex;justify-content:space-between;align-items:center;font-size:13px;font-weight:800;gap:6px}
.idc .row span{color:#8A7A60;font-weight:700;font-size:12px;flex:0 0 auto}
.wanted{background:#5A1F1F;color:#FFD9D0;border-radius:10px;padding:8px 10px;font-size:13px;font-weight:800;display:flex;gap:8px;align-items:center}
.wanted b{background:#FF7A59;color:#2A0E0E;border-radius:6px;padding:2px 6px;font-size:11px}
.btns{display:flex;gap:8px}
.btns button{flex:1;height:56px;border-radius:14px;border:0;font:inherit;font-weight:900;font-size:18px}
.btn-pass{background:#2E7D4F;color:#fff}.btn-arrest{background:#C0392B;color:#fff}
.stamp{position:absolute;right:12px;top:40%;transform:rotate(-14deg);font-size:26px;font-weight:900;border:4px solid;padding:2px 10px;border-radius:8px;opacity:.9}

.hide{display:none!important}
/* 판이 돌 때는 제목을 숨겨 작은 폰(SE)에서도 한 화면에 들어오게 */
body.playing h1{display:none}
@media (max-height:700px){.room,.apt{padding:8px;gap:8px}.room .grid{gap:6px}.doors{gap:5px}.modes button{height:42px}}
</style>
</head>
<body>
<h1>사건 4 시안</h1>
<div class="tabs" id="tabs"><button data-k="guess" class="on">몽타주</button><button data-k="id">신분증</button><button data-k="ladder">변장</button><button data-k="mine">잠복</button></div>
<div class="box" id="intro"></div>
<div id="play" class="hide" style="display:flex;flex-direction:column;gap:10px">
  <div class="hud"><span class="t" id="time">60</span><span class="st" id="stage">단계 1</span><span class="s" id="score">0</span></div>
  <div id="stagebox"></div>
  <div class="msg" id="msg"></div>
</div>
<div class="box end hide" id="end"></div>
<div class="toast" id="toast"></div>
<script>
/*
 * SuspectsCore — "수사 3팀" 퍼즐(현장 출동 한 판)의 규칙 계산. 화면과 무관한 순수 로직.
 *
 * 구조
 *   카드(용의자) = 0~80 정수 id. 3진수 네 자리가 곧 네 속성(시간대·모자·얼굴·흔적)의 값이다.
 *   검거 규칙   = 보는 속성마다 "두 명만 같으면 안 된다" ⇔ 세 값의 합이 3의 배수(모두 같음 또는 모두 다름).
 *   단계(level) = 보는 속성의 수(1~4). 처음 하는 사람을 위해 모자 → 얼굴 → 시간대 → 흔적 순으로 하나씩 늘린다.
 *                 안 보는 속성은 화면에 그리지 않고 판정에서도 뺀다(active 목록).
 *   판(board)   = 서로 다른 카드 9장. 검거하면 그 세 자리만 새 카드로 채운다.
 *   게임 상태   = 점수·연속·남은 시간(종료 시각)·단계·단서. submit / declareNone / hint 가 바꾼다.
 *   튜토리얼    = makeLesson: 두 명을 주고 "셋째는 누구?"를 고르는 문제를 만든다.
 *
 * 화면(ui.js)은 이 모듈의 결과만 읽는다. 무작위는 rng 인자로 받아 테스트가 결과를 고정할 수 있다.
 */
(function (root, factory) {
  if (typeof module === 'object' && module.exports) module.exports = factory();
  else root.SuspectsCore = factory();
})(typeof self !== 'undefined' ? self : this, function () {
  'use strict';

  var ATTRS = [
    { key: 'time', name: '시간대', values: ['낮', '저녁', '밤'] },
    { key: 'hat',  name: '모자',   values: ['맨머리', '비니', '중절모'] },   // 1.6: 캡 모자 → 비니(작게 보면 헬멧 같아서, 아이콘과 통일)
    { key: 'face', name: '얼굴',   values: ['맨얼굴', '안경', '마스크'] },
    { key: 'mark', name: '흔적',   values: ['지문', '유리 조각', '타이어 자국'] }
  ];
  var ALL = [0, 1, 2, 3];
  // 단계마다 하나씩 늘어나는 속성 순서: 모자 → 얼굴 → 시간대 → 흔적 (눈에 잘 띄는 것부터)
  var ORDER = [1, 2, 0, 3];
  var DECK_SIZE = 81;   // 3^4
  var BOARD_SIZE = 9;

  // 한 판의 수치. 밸런스는 여기만 고치면 된다.
  var RULES = {
    duration: 90,          // 시작 시간(초)
    base: 100,             // 검거 1건 기본 점수
    noneBonus: 300,        // "검거 불가" 적중 기본 점수
    hitTime: 2,            // 검거 성공 시 늘어나는 시간(초)
    noneTime: 5,           // 검거 불가 적중 시 늘어나는 시간(초)
    missPenalty: 5,        // 오인 체포 시 줄어드는 시간(초)
    wrongNonePenalty: 10,  // 검거 불가 오판 시 줄어드는 시간(초)
    comboStep: 0.5,        // 연속 검거 1회당 배수 증가
    comboMax: 3,           // 배수 상한
    hintPenalty: 3,        // 단서 한 번에 줄어드는 시간(초)
    // 이 단계에 오르는 데 필요한 누적 검거 수(단계 1은 0). 2명→얼굴, 4명→시간대, 7명→흔적
    levelAt: { 1: 0, 2: 2, 3: 4, 4: 7 }
  };

  /* ---------- 오류 ---------- */
  // 화면이 code 로 분기할 수 있게 오류에 종류를 붙인다.
  function GameError(code, message) {
    var e = new Error(message);
    e.name = 'GameError';
    e.code = code;
    return e;
  }

  /* ---------- 단계 ---------- */
  function assertLevel(level) {
    if (level !== 1 && level !== 2 && level !== 3 && level !== 4) throw GameError('BAD_LEVEL', '단계는 1~4: ' + level);
  }
  // 단계 → 보는 속성 번호 목록(ATTRS 순서로 정렬해서 화면 표시 순서가 늘 같게)
  function activeFor(level) {
    assertLevel(level);
    return ORDER.slice(0, level).sort(function (a, b) { return a - b; });
  }

  /* ---------- 카드 ---------- */
  function assertId(id) {
    if (typeof id !== 'number' || !isFinite(id) || Math.floor(id) !== id || id < 0 || id >= DECK_SIZE) {
      throw GameError('BAD_CARD', '카드 id 는 0~80 정수여야 한다: ' + id);
    }
  }

  // id → [시간대, 모자, 얼굴, 흔적] 각 0~2
  function decode(id) {
    assertId(id);
    return [id % 3, Math.floor(id / 3) % 3, Math.floor(id / 9) % 3, Math.floor(id / 27) % 3];
  }

  function encode(v) {
    if (!Array.isArray(v) || v.length !== ATTRS.length) throw GameError('BAD_CARD', '속성은 4개여야 한다');
    for (var i = 0; i < v.length; i++) {
      if (v[i] !== 0 && v[i] !== 1 && v[i] !== 2) throw GameError('BAD_CARD', '속성 값은 0~2: ' + v[i]);
    }
    return v[0] + v[1] * 3 + v[2] * 9 + v[3] * 27;
  }

  // 보는 속성만 남긴 모양(안 보는 속성은 0). 화면은 이 값으로 그린다.
  function project(id, active) {
    var v = decode(id), a = active || ALL, out = [0, 0, 0, 0];
    for (var i = 0; i < a.length; i++) out[a[i]] = v[a[i]];
    return out;
  }
  function projKey(id, active) { return project(id, active).join(''); }

  /*
   * 세 장이 한 패인가(보는 속성만 따진다).
   * 속성마다 (x+y+z) % 3 === 0 이면 "모두 같음" 또는 "모두 다름"이다(둘만 같으면 합이 3의 배수가 될 수 없다).
   * 같은 카드를 두 번 고른 경우는 판 위 자리가 다르면 생기지 않지만, 방어적으로 막는다.
   */
  function isSet(a, b, c, active) {
    if (a === b || b === c || a === c) return false;
    var x = decode(a), y = decode(b), z = decode(c), act = active || ALL;
    for (var n = 0; n < act.length; n++) {
      var i = act[n];
      if ((x[i] + y[i] + z[i]) % 3 !== 0) return false;
    }
    return true;
  }

  /*
   * 왜 틀렸는지: 규칙을 어긴 속성(= 둘만 같은 속성)과 그 값.
   * 오인 체포 때 "모자: 비니 둘만 같아요"처럼 보여 줘서 규칙을 몸으로 익히게 한다.
   */
  function explain(a, b, c, active) {
    var x = decode(a), y = decode(b), z = decode(c), out = [], act = active || ALL;
    for (var n = 0; n < act.length; n++) {
      var i = act[n];
      if ((x[i] + y[i] + z[i]) % 3 !== 0) {
        var same = x[i] === y[i] ? x[i] : (y[i] === z[i] ? y[i] : x[i]);
        out.push({ index: i, key: ATTRS[i].key, name: ATTRS[i].name, value: ATTRS[i].values[same] });
      }
    }
    return out;
  }

  // 두 장이 정해지면 셋째 장은 하나로 정해진다(속성마다 (3 - (x+y)%3) % 3).
  function thirdCard(a, b) {
    if (a === b) throw GameError('SAME_CARD', '서로 다른 두 장이어야 한다');
    var x = decode(a), y = decode(b), v = [];
    for (var i = 0; i < ATTRS.length; i++) v.push((3 - (x[i] + y[i]) % 3) % 3);
    return encode(v);
  }

  /*
   * 두 장을 골랐을 때 셋째가 갖춰야 할 조건(보조 줄·튜토리얼 해설에 쓴다).
   * 반환: [{ index, name, same, value }] — same=true 면 "둘이 같으니 셋째도 같게", false 면 "둘이 다르니 남은 하나로"
   */
  function needs(a, b, active) {
    var x = decode(a), y = decode(b), out = [], act = active || ALL;
    for (var n = 0; n < act.length; n++) {
      var i = act[n], same = x[i] === y[i];
      var v = same ? x[i] : (3 - (x[i] + y[i]) % 3) % 3;
      out.push({ index: i, key: ATTRS[i].key, name: ATTRS[i].name, same: same, value: ATTRS[i].values[v] });
    }
    return out;
  }

  // 판 위의 한 패를 모두 찾는다(9장 → 84개 조합, 충분히 가볍다).
  function findSets(board, active) {
    var out = [];
    for (var i = 0; i < board.length; i++)
      for (var j = i + 1; j < board.length; j++)
        for (var k = j + 1; k < board.length; k++)
          if (isSet(board[i], board[j], board[k], active)) out.push([i, j, k]);
    return out;
  }

  /* ---------- 무작위 ---------- */
  // 시드 고정 난수(mulberry32). 테스트와 공통 판에 쓴다.
  function makeRng(seed) {
    var s = (seed >>> 0) || 1;
    return function () {
      s = (s + 0x6D2B79F5) >>> 0;
      var t = s;
      t = Math.imul(t ^ (t >>> 15), t | 1);
      t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  function assertRng(rng) {
    if (typeof rng !== 'function') throw GameError('BAD_RNG', 'rng 는 0 이상 1 미만을 돌려주는 함수여야 한다');
  }
  // rng 가 범위를 벗어나도 판이 깨지지 않게 0~n-1 로 맞춘다
  function pickIndex(rng, n) {
    var r = rng();
    if (!(r >= 0 && r < 1)) r = 0;
    return Math.floor(r * n);
  }

  // exclude 에 없는 카드를 0 ~ limit-1 에서 count 장 뽑는다(서로 겹치지 않게). limit 기본 81.
  function drawDistinct(rng, exclude, count, limit) {
    assertRng(rng);
    limit = limit == null ? DECK_SIZE : limit;
    var used = {}, pool = [];
    for (var i = 0; i < exclude.length; i++) used[exclude[i]] = true;
    for (var id = 0; id < limit; id++) if (!used[id]) pool.push(id);
    if (pool.length < count) throw GameError('DECK_EMPTY', '뽑을 카드가 모자란다');
    var out = [];
    for (var n = 0; n < count; n++) {
      var pick = pickIndex(rng, pool.length);
      out.push(pool[pick]);
      pool.splice(pick, 1);
    }
    return out;
  }

  function newBoard(rng, limit) {
    return drawDistinct(rng, [], BOARD_SIZE, limit);
  }

  // 검거한 세 자리만 새 카드로 바꾼 판(원본은 그대로). 판 전체를 제외해 방금 잡힌 카드가 바로 다시 나오지 않게 한다.
  function refill(board, idxs, rng, limit) {
    var fresh = drawDistinct(rng, board, idxs.length, limit);
    var next = board.slice();
    for (var i = 0; i < idxs.length; i++) next[idxs[i]] = fresh[i];
    return next;
  }

  /*
   * 단계에 맞춰 카드를 뽑는다: 화면에 보이는 모양(project)이 판 위에서 겹치지 않는 카드를 먼저 고른다.
   * 모양 가짓수가 모자라면(1단계는 3가지뿐) 겹침을 허용한다. 1단계는 "같은 모자 셋"이 곧 한 패라 괜찮다.
   */
  function drawForLevel(rng, excludeIds, keepProj, count, level) {
    assertRng(rng);
    var active = activeFor(level), used = {}, seen = {}, out = [];
    for (var i = 0; i < excludeIds.length; i++) used[excludeIds[i]] = true;
    for (var j = 0; j < keepProj.length; j++) seen[keepProj[j]] = true;
    var pool = [];
    for (var id = 0; id < DECK_SIZE; id++) if (!used[id]) pool.push(id);
    for (var n = 0; n < count; n++) {
      var fresh = pool.filter(function (c) { return !seen[projKey(c, active)]; });
      var from = fresh.length ? fresh : pool;
      if (!from.length) throw GameError('DECK_EMPTY', '뽑을 카드가 모자란다');
      var pick = from[pickIndex(rng, from.length)];
      out.push(pick);
      seen[projKey(pick, active)] = true;
      pool.splice(pool.indexOf(pick), 1);
    }
    return out;
  }

  function dealBoard(rng, level) {
    return drawForLevel(rng, [], [], BOARD_SIZE, level);
  }

  function refillBoard(board, idxs, rng, level) {
    var active = activeFor(level), keep = [];
    for (var i = 0; i < board.length; i++) if (idxs.indexOf(i) < 0) keep.push(projKey(board[i], active));
    var fresh = drawForLevel(rng, board, keep, idxs.length, level);
    var next = board.slice();
    for (var k = 0; k < idxs.length; k++) next[idxs[k]] = fresh[k];
    return next;
  }

  /* ---------- 게임 ---------- */
  // 연속 검거 n 번째의 점수 배수: 1, 1.5, 2, 2.5, 3, 3, ...
  // 연속 검거 배수(평소 규칙). 판의 상한이 다르면 multiplierFor 를 쓴다
  //   (인자를 하나만 받는다: [..].map(multiplier) 처럼 써도 두 번째 인자가 끼어들지 않게)
  function multiplier(combo) { return multiplierFor(combo, RULES.comboMax); }
  function multiplierFor(combo, max) {
    if (combo < 1) return 1;
    return Math.min(max == null ? RULES.comboMax : max, 1 + RULES.comboStep * (combo - 1));
  }

  /*
   * 판마다 바꿀 수 있는 규칙(0.1.19: 하루 한 번 특별 출동 · 출동 준비물).
   *   scoreMult  점수 배수(기본 1)          comboMax  연속 배수 상한(기본 RULES.comboMax)
   *   hitTime    검거 때 늘어나는 초          missPenalty 오인 체포 때 줄어드는 초
   *   noneMult   검거 불가 적중 점수 배수      noHints   단서 못 씀
   *   shield     오인 체포 벌점을 면제하는 횟수(준비물 "변호사 대기")
   * 모르는 키는 버리고, 값이 이상하면 BAD_OPTION 을 던진다(판을 만들 때 한 번만 검사).
   */
  /*   0.7.0 난이도(단순·강력·미제 사건):
   *   missMul    벌점(오인·함정·검거 불가 오판) 배수(단순 0.5 · 미제 1.5)
   *   hintPenalty 단서 한 번에 줄어드는 초(미제 5). null 이면 모드 기본
   *   lvSpeed    단계가 오르는 속도. 단계 계산에 쓰는 검거 수 = floor(검거 수 × lvSpeed)(단순 0.67 · 미제 1.5)
   */
  var MOD_DEFAULTS = { scoreMult: 1, comboMax: null, hitTime: null, missPenalty: null, noneMult: 1, noHints: false, shield: 0, missMul: 1, hintPenalty: null, lvSpeed: 1 };
  function readMods(m) {
    m = m && typeof m === 'object' ? m : {};
    var out = {};
    Object.keys(MOD_DEFAULTS).forEach(function (k) { out[k] = m[k] == null ? MOD_DEFAULTS[k] : m[k]; });
    var num = function (v, min, max) { return typeof v === 'number' && isFinite(v) && v >= min && v <= max; };
    if (!num(out.scoreMult, 0.1, 10) || !num(out.noneMult, 0.1, 10)) throw GameError('BAD_OPTION', '점수 배수는 0.1~10');
    if (out.comboMax != null && !num(out.comboMax, 1, 20)) throw GameError('BAD_OPTION', '연속 배수 상한은 1~20');
    if (out.hitTime != null && !num(out.hitTime, 0, 30)) throw GameError('BAD_OPTION', '검거 시간은 0~30초');
    if (out.missPenalty != null && !num(out.missPenalty, 0, 60)) throw GameError('BAD_OPTION', '오인 벌점은 0~60초');
    if (!num(out.shield, 0, 10) || Math.floor(out.shield) !== out.shield) throw GameError('BAD_OPTION', '면제 횟수는 0~10 정수');
    if (!num(out.missMul, 0, 5)) throw GameError('BAD_OPTION', '벌점 배수는 0~5');
    if (out.hintPenalty != null && !num(out.hintPenalty, 0, 30)) throw GameError('BAD_OPTION', '단서 벌점은 0~30초');
    if (!num(out.lvSpeed, 0.2, 5)) throw GameError('BAD_OPTION', '단계 속도는 0.2~5');
    out.noHints = out.noHints === true;
    return out;
  }

  /* ---------- 난이도 도우미(0.7.0) — 다섯 모드가 같이 쓴다 ---------- */
  // 벌점 초에 난이도 배수를 곱한다(0.5초 단위 반올림, 0 이상)
  function missPen(state, pen) {
    var m = state && state.mods && state.mods.missMul != null ? state.mods.missMul : 1;
    return Math.max(0, Math.round(pen * m * 2) / 2);
  }
  // 단서 한 번 값(초): 난이도가 정해 두었으면 그것, 아니면 모드 기본
  function hintCost(state, base) {
    var h = state && state.mods ? state.mods.hintPenalty : null;
    return h == null ? base : h;
  }
  // 단계 계산에 쓰는 검거 수
  function lvHits(state) {
    var s = state && state.mods && state.mods.lvSpeed != null ? state.mods.lvSpeed : 1;
    return Math.floor((state.hits || 0) * s + 1e-9);
  }
  // 단계 문턱(need, 평소 검거 수)에 닿으려면 실제로 몇 명을 잡아야 하나(화면의 "다음까지 N명")
  function hitsFor(state, need) {
    var s = state && state.mods && state.mods.lvSpeed != null ? state.mods.lvSpeed : 1;
    return Math.ceil(need / s - 1e-9);
  }

  function assertNow(now) {
    if (typeof now !== 'number' || !isFinite(now)) throw GameError('BAD_TIME', 'now 는 밀리초 숫자여야 한다');
  }

  /*
   * 새 게임. opts:
   *   rng, now(ms)        — 필수
   *   duration(초)        — 기본 90 (사무실 장비 "수사 기간 연장"이 늘린다)
   *   level               — 시작 단계 1~4, 기본 1. 노말은 4.
   *   freeHints           — 시간이 줄지 않는 단서 횟수(장비 "베테랑 형사")
   *   nonePenalty(초)     — 검거 불가 오판 벌점(장비 "증거 보관실"이 줄인다)
   *   mods                — 판마다 바꾸는 규칙(readMods 참고). 없으면 평소 규칙
   * 남은 시간은 "종료 시각(endAt)"으로 들고 있다. 매 프레임 깎지 않아도 되고, 탭을 떠나도 정확하다.
   */
  function createGame(opts) {
    opts = opts || {};
    assertRng(opts.rng);
    assertNow(opts.now);
    var duration = opts.duration == null ? RULES.duration : opts.duration;
    if (!(duration > 0)) throw GameError('BAD_DURATION', '시간은 0보다 커야 한다');
    var level = opts.level == null ? 1 : opts.level;
    assertLevel(level);
    var freeHints = opts.freeHints == null ? 0 : opts.freeHints;
    var nonePenalty = opts.nonePenalty == null ? RULES.wrongNonePenalty : opts.nonePenalty;
    if (!(freeHints >= 0) || !(nonePenalty >= 0)) throw GameError('BAD_OPTION', '단서·벌점 값은 0 이상');
    var mods = readMods(opts.mods);
    return {
      mods: mods, shield: mods.shield, shieldUsed: 0,
      rng: opts.rng,
      level: level,
      startLevel: level,
      board: dealBoard(opts.rng, level),
      clue: null,       // 단서: { set:[i,j,k], shown:n } — 판이 바뀌면 null
      hints: 0, freeHints: freeHints, nonePenalty: nonePenalty,
      score: 0, combo: 0, bestCombo: 0,
      hits: 0, misses: 0, noneHits: 0, noneMisses: 0,
      endAt: opts.now + duration * 1000,
      pausedAt: null,   // 일시정지 중이면 멈춘 시각(ms), 아니면 null
      over: false
    };
  }

  function active(state) { return activeFor(state.level); }

  // 일시정지 중에는 멈춘 시각 기준으로 남은 시간을 센다(시간이 흐르지 않는다)
  function timeLeft(state, now) {
    assertNow(now);
    var at = state.pausedAt != null ? state.pausedAt : now;
    return Math.max(0, (state.endAt - at) / 1000);
  }

  // "처음으로" 확인 창이 떠 있는 동안 시간을 멈춘다. 재개하면 멈춘 만큼 종료 시각을 뒤로 민다.
  function pause(state, now) {
    assertNow(now);
    if (state.over) throw GameError('GAME_OVER', '이미 끝난 판이다');
    if (state.pausedAt == null) state.pausedAt = now;
  }

  function resume(state, now) {
    assertNow(now);
    if (state.pausedAt == null) return;
    state.endAt += Math.max(0, now - state.pausedAt);
    state.pausedAt = null;
  }

  // 시간이 다 됐으면 끝낸다. 끝났는지 돌려준다.
  function tick(state, now) {
    if (state.pausedAt != null) return state.over;
    if (!state.over && timeLeft(state, now) <= 0) state.over = true;
    return state.over;
  }

  function guard(state, now, what) {
    if (state.pausedAt != null) throw GameError('PAUSED', '멈춘 판에서는 ' + what + ' 수 없다');
    if (tick(state, now)) throw GameError('GAME_OVER', '이미 끝난 판이다');
  }

  function addCombo(state) {
    state.combo += 1;
    if (state.combo > state.bestCombo) state.bestCombo = state.combo;
    return multiplierFor(state.combo, state.mods ? state.mods.comboMax : null);
  }

  // 누적 검거 수로 다음 단계를 정한다(올라가기만 한다)
  function levelForHits(startLevel, hits) {
    var lv = startLevel;
    for (var l = startLevel + 1; l <= 4; l++) if (hits >= RULES.levelAt[l]) lv = l;
    return lv;
  }

  /*
   * 검거 시도. idxs = 판 위의 자리 세 개(0~8, 서로 다름). state 를 직접 바꾼다.
   * 반환: 성공 { ok:true, gain, combo, mult, replaced, levelUp? }, 실패 { ok:false, reasons, penalty }
   */
  function submit(state, idxs, now) {
    guard(state, now, '고를');
    if (!Array.isArray(idxs) || idxs.length !== 3) throw GameError('BAD_PICK', '세 명을 골라야 한다');
    for (var i = 0; i < 3; i++) {
      var v = idxs[i];
      if (typeof v !== 'number' || Math.floor(v) !== v || v < 0 || v >= state.board.length) {
        throw GameError('BAD_PICK', '판에 없는 자리: ' + v);
      }
    }
    if (idxs[0] === idxs[1] || idxs[1] === idxs[2] || idxs[0] === idxs[2]) throw GameError('BAD_PICK', '같은 자리를 두 번 골랐다');

    var act = active(state);
    var a = state.board[idxs[0]], b = state.board[idxs[1]], c = state.board[idxs[2]];
    if (isSet(a, b, c, act)) {
      var mult = addCombo(state);
      var md = state.mods || MOD_DEFAULTS;
      var gain = Math.round(RULES.base * mult * md.scoreMult);
      state.score += gain;
      state.hits += 1;
      state.endAt += (md.hitTime == null ? RULES.hitTime : md.hitTime) * 1000;
      state.clue = null;
      var next = levelForHits(state.startLevel, lvHits(state));
      if (next !== state.level) {
        // 새 속성이 열리는 순간: 판 전체를 새 단계에 맞춰 깐다
        state.level = next;
        state.board = dealBoard(state.rng, next);
        return { ok: true, gain: gain, combo: state.combo, mult: mult, levelUp: next, replaced: [0, 1, 2, 3, 4, 5, 6, 7, 8] };
      }
      state.board = refillBoard(state.board, idxs, state.rng, state.level);
      return { ok: true, gain: gain, combo: state.combo, mult: mult, replaced: idxs.slice() };
    }
    state.combo = 0;
    state.misses += 1;
    // 변호사 대기(준비물): 남은 면제 횟수가 있으면 시간을 깎지 않는다(연속은 끊긴다)
    var md2 = state.mods || MOD_DEFAULTS, pen = md2.missPenalty == null ? RULES.missPenalty : md2.missPenalty, shielded = false;
    pen = missPen(state, pen);
    if (state.shield > 0) { state.shield -= 1; state.shieldUsed += 1; pen = 0; shielded = true; }
    state.endAt -= pen * 1000;
    tick(state, now);
    return { ok: false, reasons: explain(a, b, c, act), penalty: pen, shielded: shielded };
  }

  /*
   * "검거 불가" 선언. 판에 한 패가 없으면 적중: 큰 점수 + 판 전체를 새로 깐다.
   * 하나라도 있으면 오판: 시간이 크게 줄고 연속이 끊긴다(몇 패 남았는지만 알려 준다).
   */
  function declareNone(state, now) {
    guard(state, now, '선언할');
    var sets = findSets(state.board, active(state));
    if (sets.length === 0) {
      var mult = addCombo(state);
      var mdn = state.mods || MOD_DEFAULTS;
      var gain = Math.round(RULES.noneBonus * mult * mdn.scoreMult * mdn.noneMult);
      state.score += gain;
      state.noneHits += 1;
      state.endAt += RULES.noneTime * 1000;
      state.board = dealBoard(state.rng, state.level);
      state.clue = null;
      return { ok: true, gain: gain, combo: state.combo, mult: mult };
    }
    state.combo = 0;
    state.noneMisses += 1;
    var np = missPen(state, state.nonePenalty);
    state.endAt -= np * 1000;
    tick(state, now);
    return { ok: false, remaining: sets.length, penalty: np };
  }

  // 단서 한 번의 값: 무료 단서가 남았으면 0초, 아니면 hintPenalty 초
  function chargeHint(state, now) {
    var p = 0;
    if (state.freeHints > 0) state.freeHints -= 1;
    else { p = hintCost(state, RULES.hintPenalty); state.endAt -= p * 1000; }
    state.hints += 1;
    tick(state, now);
    return p;
  }

  /*
   * 단서: 누를 때마다 한 패의 한 명씩, 최대 두 명까지 짚어 준다.
   *   두 명이 보이면 셋째는 하나로 정해지므로 직접 찾게 둔다(규칙을 익히는 연습).
   *   판에 한 패가 없으면 그 사실을 알려 준다(검거 불가를 누르라는 뜻).
   *   이미 두 명을 보여 줬으면 다시 눌러도 깎지 않고 같은 두 명을 돌려준다.
   * 반환: { none:true, penalty } 또는 { indices:[...], penalty }
   */
  function hint(state, now) {
    guard(state, now, '단서를 볼');
    if (state.mods && state.mods.noHints) throw GameError('NO_HINTS', '이 출동은 단서를 쓸 수 없다');
    if (!state.clue) {
      var sets = findSets(state.board, active(state));
      if (sets.length === 0) return { none: true, penalty: chargeHint(state, now) };
      state.clue = { set: sets[pickIndex(state.rng, sets.length)], shown: 0 };
    }
    var penalty = 0;
    if (state.clue.shown < 2) {
      state.clue.shown += 1;
      penalty = chargeHint(state, now);
    }
    return { indices: state.clue.set.slice(0, state.clue.shown), penalty: penalty };
  }

  /* ---------- 튜토리얼 ---------- */
  function shuffle(rng, arr) {
    var a = arr.slice();
    for (var i = a.length - 1; i > 0; i--) {

  id: { t: '② 신분증 검사', rule: ['한 명씩 사진과 신분증이 와요.', '하나라도 다르면 위조, 체포. 모두 같으면 통과.', '단계 3부터는 수배 조건에 걸리면 신분증이 맞아도 체포해요.'], ref: '참고: Papers, Please' },
  ladder: { t: '③ 변장 추적', rule: ['범인은 한 번에 하나씩만 바꿔 입었어요.', '노란 테두리(첫 모습)에서 시작해, 하나만 다른 사람을 차례로 눌러요.', '더 갈 곳이 없는 사람이 지금 모습이에요. 끝까지 가면 검거.'], ref: '참고: 단어 사다리' },
  mine: { t: '④ 잠복 수색', rule: ['문을 열면 둘레 여덟 문 뒤에 숨은 범인 수가 나와요.', '범인이 있는 문은 체포로 바꿔 눌러요. 범인 문을 열면 놓쳐요.', '범인을 다 잡으면 다음 동으로 가요.'], ref: '참고: 지뢰찾기' }
};
var mode = 'guess', startSt = 1, G = null, timer = 0;
function intro() {
  var I = INFO[mode];
  $('intro').innerHTML = '<h2>' + I.t + '</h2><ul class="rule">' + I.rule.map(function (r) { return '<li>' + r + '</li>'; }).join('') + '</ul><div class="ref">' + I.ref + '</div>' +
    '<div class="lv">' + [1, 2, 3].map(function (s) { return '<button data-s="' + s + '"' + (s === startSt ? ' class="on"' : '') + '>단계 ' + s + '부터</button>'; }).join('') + '</div>' +
    '<button class="go" id="go">출동</button>';
  $('intro').classList.remove('hide'); $('play').classList.add('hide'); $('end').classList.add('hide');
}
$('intro').addEventListener('click', function (e) {
  var b = e.target.closest('button'); if (!b) return;
  if (b.id === 'go') start();
  else if (b.dataset.s) { startSt = +b.dataset.s; intro(); }
});
$('tabs').addEventListener('click', function (e) {
  var b = e.target.closest('button'); if (!b) return; stop();
  mode = b.dataset.k; [].forEach.call($('tabs').children, function (x) { x.classList.toggle('on', x === b); }); intro();
});
function toast(t) { var el = $('toast'); el.textContent = t; el.classList.add('on'); clearTimeout(toast.t); toast.t = setTimeout(function () { el.classList.remove('on'); }, 1300); }
function msg(t, c) { var m = $('msg'); m.textContent = t || ''; m.className = 'msg' + (c ? ' ' + c : ''); }
function buzz(v) { try { navigator.vibrate && navigator.vibrate(v); } catch (e) {} }
function start() {
  G = { t: 60, score: 0, st: startSt, hits: 0, end: Date.now() + 60000, busy: false };
  $('intro').classList.add('hide'); $('end').classList.add('hide'); $('play').classList.remove('hide'); document.body.classList.add('playing');
  clearInterval(timer); timer = setInterval(tick, 100); next(); tick();
}
function stop() { document.body.classList.remove('playing'); clearInterval(timer); G = null; }
function tick() {
  if (!G) return;
  var left = Math.max(0, (G.end - Date.now()) / 1000);
  $('time').textContent = Math.ceil(left); $('time').classList.toggle('low', left < 10);
  $('score').textContent = G.score.toLocaleString(); $('stage').textContent = '단계 ' + G.st;
  if (left <= 0) finish();
}
function addTime(s) { G.end += s * 1000; }
function good(pts, sec, text) {
  G.score += pts; addTime(sec); G.hits++; msg(text || ('검거 +' + pts), 'ok'); buzz(20);
  if (G.hits % 4 === 0 && G.st < 3) { G.st++; toast(NEW[G.st]); }
}
function bad(text) { addTime(-5); msg((text ? text + ' ' : '') + '−5초', 'bad'); buzz([40, 40, 40]); }
function finish() {
  var s = G.score, h = G.hits; stop();
  $('play').classList.add('hide');
  $('end').innerHTML = '<div>검거 ' + h + '명</div><b>' + s.toLocaleString() + '</b><div class="ref">점수</div><button class="go" id="again" style="width:100%;margin-top:8px">다시</button><button class="go" id="back" style="width:100%;background:var(--panel2);color:var(--text)">규칙 보기</button>';
  $('end').classList.remove('hide');
}
$('end').addEventListener('click', function (e) { if (e.target.id === 'again') start(); if (e.target.id === 'back') intro(); });
function next() { G.busy = false; msg(''); ({ guess: nextGuess, id: nextId, ladder: nextLadder, mine: nextMine })[mode](); }
function later(f, ms) { setTimeout(function () { if (G) f(); }, ms); }

/* ① 몽타주 화면 */
function nextGuess() { G.q = makeGuess(G.st); drawGuess(); }
function drawGuess() {
  var q = G.q, cols = q.board.length === 9 ? 'g3' : 'g4';
  var tried = {}; q.tries.forEach(function (t) { tried[t.j] = t; });
  var hist = q.tries.slice(-3).map(function (t) {
    return '<div class="trow">' + cardHtml(q.board[t.j], q.act, 'disabled', 'mini') + (q.countOnly
      ? '<span class="cnt">' + t.hit + ' / ' + q.act.length + ' 맞음</span>'
      : q.act.map(function (i) { var ok = C.decode(q.board[t.j])[i] === C.decode(q.ans)[i]; return '<span class="tile ' + (ok ? 'g' : 'x') + '">' + NAMES[i] + '<b>' + VALS[i][C.decode(q.board[t.j])[i]] + '</b></span>'; }).join('')) + '</div>';
  }).join('');
  $('stagebox').innerHTML = '<div class="room"><div class="mtg"><span class="mtg-q">?</span><div class="mtg-t">범인 몽타주</div><div class="mtg-n">대조 ' + q.tries.length + '번</div></div>' +
    '<div class="hist">' + (hist || '<div class="ref" style="text-align:center;padding:10px 0">카드를 눌러 대조해요</div>') + '</div>' +
    '<div class="grid ' + cols + '">' + q.board.map(function (id, j) { return cardHtml(id, q.act, 'data-j="' + j + '"' + (tried[j] ? ' disabled' : ''), tried[j] ? 'out' : ''); }).join('') + '</div></div>';
}
/* ② 신분증 화면 */
function nextId() {
  var q = G.q = makeId(G.st), v = q.doc;
  $('stagebox').innerHTML = '<div class="desk">' + (q.wanted ? '<div class="wanted"><b>수배</b>' + NAMES[q.wanted[0]] + ' ' + VALS[q.wanted[0]][q.wanted[1]] + '</div>' : '') +
    '<div class="pair" style="position:relative">' + cardHtml(q.id, q.act, 'disabled').replace('<button', '<div').replace('</button>', '</div>') +
    '<div class="idc"><div class="hd"><span>신분증</span><span>No.' + (1000 + ri(9000)) + '</span></div>' +
    q.act.map(function (i) { return '<div class="row"><span>' + NAMES[i] + '</span>' + VALS[i][v[i]] + '</div>'; }).join('') + '</div></div>' +
    '<div class="btns"><button class="btn-pass" data-a="pass">통과</button><button class="btn-arrest" data-a="arrest">체포</button></div></div>';
}
/* ③ 변장 추적 화면 */
function nextLadder() { G.q = makeLadder(G.st); drawLadder(); }
function drawLadder() {
  var q = G.q, cols = q.board.length === 9 ? 'g3' : 'g4', cur = q.chain[q.at], passed = q.chain.slice(0, q.at);
  var trail = q.chain.slice(0, q.at + 1).map(function (id, k) { return (k ? '<i class="arr">›</i>' : '') + cardHtml(id, q.act, 'disabled', 'mini' + (k === q.at ? ' now' : '')); }).join('');
  $('stagebox').innerHTML = '<div class="room"><div class="trail">' + trail + '<span class="left">' + (q.L - q.at) + '걸음 남음</span></div>' +
    '<div class="grid ' + cols + '">' + q.board.map(function (id, j) {
      var c = id === cur ? 'cur' : passed.indexOf(id) >= 0 ? 'out' : '';
      return cardHtml(id, q.act, 'data-j="' + j + '"' + (c ? ' disabled' : ''), c);
    }).join('') + '</div></div>';
}
/* ④ 잠복 수색 화면 */
function nextMine() { G.q = makeMine(G.st); G.flagMode = false; drawMine(); }
function drawMine() {
  var q = G.q, cells = '';
  for (var i = 0; i < q.w * q.h; i++) {
    var c = 'door', t = '';
    if (q.lost[i]) { c += ' lost'; t = cardInner(q.faces[i], null, [1, 2]); }
    else if (q.flag[i]) { c += ' got'; t = cardInner(q.faces[i], null, [1, 2]) + '<em>체포</em>'; }
    else if (q.open[i]) { var n = count(q, i); c += ' open n' + n; t = n ? '<b>' + n + '</b>' : ''; }
    cells += '<button class="' + c + '" data-c="' + i + '">' + t + '</button>';
  }
  var left = q.m - Object.keys(q.flag).length - Object.keys(q.lost).length;
  $('stagebox').innerHTML = '<div class="apt"><div class="apt-hd"><span>' + (101 + G.hits) + '동</span><span>남은 범인 ' + left + '</span></div>' +
    '<div class="doors" style="grid-template-columns:repeat(' + q.w + ',1fr)">' + cells + '</div>' +
    '<div class="modes"><button data-m="0" class="' + (G.flagMode ? '' : 'on') + '">문 열기</button><button data-m="1" class="arrest' + (G.flagMode ? ' on' : '') + '">체포</button></div></div>';
}

$('stagebox').addEventListener('click', function (e) {
  if (!G || G.busy) return;
  var b = e.target.closest('button'); if (!b) return;
  var q = G.q;
  if (mode === 'guess') {
    if (b.dataset.j == null) return;
    var j = +b.dataset.j, id = q.board[j];
    if (id === q.ans) {
      var n = q.tries.length + 1, pts = [0, 300, 220, 160, 120][n] || 80;
      b.classList.add('right'); good(pts, 3, n === 1 ? '한 번에! +' + pts : '검거 +' + pts); G.busy = true; later(next, 700);
    } else {
      var hit = q.act.filter(function (i) { return C.decode(id)[i] === C.decode(q.ans)[i]; }).length;
      q.tries.push({ j: j, hit: hit }); addTime(-1); drawGuess(); msg('');
    }
  } else if (mode === 'id') {
    if (!b.dataset.a) return;
    var ok = (b.dataset.a === 'arrest') === q.arrest;
    var pr = document.querySelector('.pair'), s = document.createElement('div');
    s.className = 'stamp'; s.textContent = q.arrest ? '체포' : '통과'; s.style.color = q.arrest ? '#C0392B' : '#2E7D4F'; pr.appendChild(s);
    if (ok) good(80, 1, (q.arrest ? '체포 ' + q.why : '통과') + ' +80'); else bad(q.arrest ? '놓쳤어요: ' + q.why : '죄 없는 사람이에요');
    G.busy = true; later(next, ok ? 450 : 1100);
  } else if (mode === 'ladder') {
    if (b.dataset.j == null) return;
    var id2 = q.board[+b.dataset.j];
    if (id2 === q.chain[q.at + 1]) {
      q.at++; buzz(10);
      if (q.at === q.L) { drawLadder(); var nw = document.querySelector('#stagebox .card.cur'); if (nw) nw.classList.add('right'); good(90 + q.L * 30, 3, '지금 모습 찾음 +' + (90 + q.L * 30)); G.busy = true; later(next, 750); }
      else { drawLadder(); msg(''); }
    } else {
      var d2 = dist(id2, q.chain[q.at], q.act);
      b.classList.add('wrong'); bad(d2 >= 2 ? d2 + '개가 달라요' : '그 길은 막혀요');
    }
  } else if (mode === 'mine') {
    if (b.dataset.m != null) { G.flagMode = b.dataset.m === '1'; drawMine(); return; }
    if (b.dataset.c == null) return;
    var c = +b.dataset.c;
    if (q.open[c] || q.flag[c] || q.lost[c]) return;
    if (!q.mines) placeMines(q, c);
    if (G.flagMode) {
      if (q.mines[c]) { q.flag[c] = 1; G.score += 40; msg('체포 +40', 'ok'); buzz(20); }
      else { openCell(q, c); bad('빈집이에요'); }
    } else {
      if (q.mines[c]) { q.lost[c] = 1; bad('놓쳤어요'); }
      else openCell(q, c);
    }
    drawMine();
    var done = Object.keys(q.mines).every(function (k) { return q.flag[k] || q.lost[k]; });
    if (done) { var got = Object.keys(q.flag).length; good(60 + got * 40, 4, got + '명 검거 +' + (60 + got * 40)); G.busy = true; later(next, 900); }
  }
});
window.__selfTest = selfTest; window.__G = function () { return G; };   // 검수용
selfTest(); intro();
})();
</script>
