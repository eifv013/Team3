<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>수사 3팀 · 사건 3 서브 시안 — 몽타주 수배</title>
<!--
  사건 3 서브 콘텐츠 완성 시안: 몽타주 수배.
  - 게임과 같은 용의자 카드(81장, 시간대 · 모자 · 얼굴 · 흔적). 그림은 빌드 때 ui.js 에서 그대로 넣는다.
  - 몽타주에 특징이 하나씩(1.4초마다, 단계 2는 1.1초) 연필로 그려진다. 아직 모르는 특징 자리는 "?"(없음과 헷갈리지 않게).
  - 일찍 맞힐수록 배수가 크다: 가려진 특징 수 + 1(처음 ×4 → 다 그려지면 ×1). 다 그려지면 정답은 늘 하나(카드가 모두 다름).
  - 단계 1: 9명, 미끼 절반은 무작위 / 단계 2: 12명, 미끼 대부분이 정답과 특징 하나만 다름(일찍 찍기가 위험)
  - 연출: 스케치북 · 연필 긁는 소리 · 지우개 가루 · 수배 전단 도장 · 맞히면 전단이 날아간다
  빌드: python3 tools/proto_build.py → proto/case3-montage.html
-->
<style>
:root{--bg:#1A1712;--panel:#262119;--panel2:#302A20;--line:#463E2F;--text:#F3EEE3;--muted:#ADA38F;--acc:#FFD23F;--ink:#1B1E24;--ok:#3DDC84;--miss:#FF6B6B}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:'IBM Plex Sans KR','Apple SD Gothic Neo','Noto Sans KR',sans-serif}
body{max-width:460px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;overflow-x:hidden}
button{font:inherit}
.card{position:relative;aspect-ratio:4/5;padding:0;border:0;border-radius:10px;overflow:hidden;box-shadow:inset 0 0 0 1px rgba(255,255,255,.06)}
.card svg{display:block}
.card .t{position:absolute;top:6px;left:6px;width:28px;height:28px;border-radius:14px;display:flex;align-items:center;justify-content:center}
.card .m{position:absolute;bottom:6px;right:6px;width:28px;height:28px;border-radius:14px;display:flex;align-items:center;justify-content:center;z-index:1}
.card .t svg,.card .m svg{width:17px;height:17px}
.card .fig{position:absolute;left:50%;bottom:0;width:86%;transform:translateX(-50%)}
.card .pick,.card .no{display:none}
.top{padding:14px 14px 6px;display:flex;flex-direction:column;gap:4px}
.label{font-size:12px;color:var(--muted);font-weight:600}
.top h1{margin:0;font-size:22px}
.hud{display:flex;align-items:center;gap:10px;padding:0 14px}
.bar{flex:1;height:10px;border-radius:5px;background:var(--panel2);overflow:hidden}
.bar i{display:block;height:100%;width:100%;background:linear-gradient(90deg,#FFB13F,var(--acc));transform-origin:left;transition:transform .1s linear}
.bar.low i{background:var(--miss)}
.hud b{font-size:18px;color:var(--acc);min-width:64px;text-align:right;font-variant-numeric:tabular-nums}
.hud .lvp{font-size:12px;font-weight:700;color:var(--muted);min-width:44px}

/* 스케치북 */
.desk{position:relative;margin:10px 12px 0;padding:14px 12px 12px;border-radius:14px;background:radial-gradient(ellipse at 30% 20%,#4A3E2C,#2A2319 70%)}
.paper{position:relative;margin:0 auto;width:250px;padding:12px 12px 10px;background:#FBF6EA;border-radius:4px;box-shadow:0 8px 20px rgba(0,0,0,.45);transform:rotate(-1.6deg);display:flex;gap:12px;align-items:center}
.paper::before{content:'';position:absolute;top:-8px;left:50%;width:70px;height:18px;margin-left:-35px;background:rgba(255,236,170,.75);transform:rotate(2deg)}
.paper .pic{position:relative;width:104px;flex:none}
.paper .pic .card{width:100%;filter:grayscale(1) contrast(1.15) brightness(1.05);box-shadow:none;border:1.5px dashed #B9AE96}
.paper .pic .card::after{content:'';position:absolute;inset:0;background:repeating-linear-gradient(-35deg,rgba(60,50,30,.10) 0 1px,transparent 1px 5px);pointer-events:none}
.q{position:absolute;z-index:3;font-weight:900;color:#B9AE96;font-size:20px;line-height:1}
.q.t{top:6px;left:9px}.q.h{top:2px;left:50%;transform:translateX(-50%)}.q.f{top:44%;left:50%;transform:translateX(-50%)}.q.m{bottom:6px;right:10px}
.paper ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:5px;font-size:13px;color:#3A342A;font-weight:800;min-width:0}
.paper li.no{color:#C8BEA8;font-weight:600}
.paper li.new{animation:hl .6s ease-out}
@keyframes hl{from{background:rgba(255,210,63,.75)}to{background:transparent}}
.mult{position:absolute;top:8px;right:12px;font:900 20px/1 'IBM Plex Sans KR',sans-serif;color:var(--acc);text-shadow:0 2px 0 #000}
.mult.drop{animation:drop .35s ease-out}
@keyframes drop{from{transform:scale(1.6)}to{transform:none}}
.pencil{position:absolute;width:56px;height:8px;border-radius:2px;background:linear-gradient(90deg,#333 0 8px,#F0C04A 8px 46px,#E99 46px);z-index:4;pointer-events:none;opacity:0;transform-origin:0 50%}
.pencil.go{animation:scribble .5s ease-in-out}
@keyframes scribble{0%{opacity:1;transform:translate(0,0) rotate(-30deg)}25%{transform:translate(10px,6px) rotate(-26deg)}50%{transform:translate(-6px,10px) rotate(-34deg)}75%{transform:translate(8px,14px) rotate(-28deg)}100%{opacity:0;transform:translate(0,18px) rotate(-30deg)}}
.crumb{position:absolute;width:4px;height:3px;background:#C9BFAA;border-radius:1px;z-index:4;pointer-events:none;animation:crumb .7s ease-out forwards}
@keyframes crumb{to{transform:translate(var(--dx),40px);opacity:0}}
.paper.fly{animation:fly .55s ease-in forwards}
@keyframes fly{to{transform:translate(140px,-120px) rotate(28deg);opacity:0}}
.stampW{position:absolute;right:8px;bottom:10px;z-index:5;border:3px solid #E5484F;color:#E5484F;font-weight:900;font-size:16px;padding:2px 6px;border-radius:6px;transform:rotate(-12deg) scale(2);opacity:0}
.paper.caught .stampW{animation:st .28s cubic-bezier(.3,1.6,.6,1) forwards}
@keyframes st{to{opacity:1;transform:rotate(-12deg) scale(1)}}

/* 용의자 판 */
.board{display:grid;gap:8px;padding:12px}
.board .card{cursor:pointer}
.board .card.enter{animation:enter .3s cubic-bezier(.2,1.4,.4,1) both}
@keyframes enter{from{opacity:0;transform:scale(.7)}to{opacity:1;transform:none}}
.board .card.ok{box-shadow:0 0 0 3px var(--ok),0 0 16px var(--ok)}
.board .card.bad{animation:shake .35s;box-shadow:0 0 0 3px var(--miss)}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.msg{min-height:20px;text-align:center;font-weight:800;font-size:14px}
.cover[hidden]{display:none}
.cover{position:fixed;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;background:rgba(14,12,9,.88)}
.cover .box{width:min(92vw,420px);background:var(--panel);border-radius:18px;padding:18px;display:flex;flex-direction:column;gap:10px}
.cover h2{margin:0;font-size:22px}.cover p{margin:0;font-size:14px;line-height:1.6;color:#D6CDBA}
.cover .row{display:flex;gap:6px}.cover .row button{flex:1;height:40px;border-radius:10px;border:1.5px solid var(--line);background:none;color:var(--muted);font-weight:700}
.cover .row button.on{border-color:var(--acc);color:var(--acc)}
.go{height:54px;border:0;border-radius:14px;background:var(--acc);color:#1B1E24;font-weight:800;font-size:17px}
.big{font-size:44px;color:var(--acc);font-weight:900;text-align:center}
.note{padding:4px 14px 24px;font-size:12px;color:var(--muted);line-height:1.5}
@media (prefers-reduced-motion:reduce){*{animation:none !important;transition:none !important}}
</style>
</head>
<body>
<div class="top"><span class="label">사건 3 · 서브 콘텐츠 시안</span><h1>몽타주 수배 — 일찍 맞힐수록 크게</h1></div>
<div class="hud"><span class="lvp" id="lvp">단계 1</span><div class="bar" id="bar"><i id="bari"></i></div><b id="score">0</b></div>
<div class="desk" id="desk"><span class="mult" id="mult">×4</span><div id="paperWrap"></div></div>
<div class="msg" id="msg"></div>
<div class="board" id="board"></div>
<p class="note">시안: 게임과 같은 용의자 카드예요. 몽타주는 목격자가 떠올리는 대로 특징이 하나씩 그려져요. 처음엔 ×4, 다 그려지면 ×1. 틀리면 −5초, 맞히면 +2초.</p>
<div class="cover" id="cover"><div class="box">
  <span class="label">사건 3 · 서브 콘텐츠</span>
  <h2>몽타주 수배</h2>
  <p>목격자가 범인의 특징을 <b>하나씩</b> 떠올려요. 몽타주가 다 그려지기 전에 맞히면 <b>점수 배수가 커요</b>. 너무 일찍 찍으면 틀릴 수 있어요. 아직 모르는 특징은 <b>?</b>로 보여요.</p>
  <span class="label">시작 단계</span>
  <div class="row" id="lvsel"><button data-l="1" class="on">1 (9명)</button><button data-l="2">2 (12명 · 닮은 사람)</button></div>
  <button class="go" id="go">수배 시작 (60초)</button>
</div></div>
<script>
/*CORE*/
</script>
<script>
'use strict';
var C = SuspectsCore;
/*CARDART*/

var AC = null;
function audio() { if (!AC) { try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { AC = null; } } return AC; }
function tone(f, d, type, g, at) { var a = audio(); if (!a) return; var t = a.currentTime + (at || 0), o = a.createOscillator(), v = a.createGain(); o.type = type || 'sine'; o.frequency.value = f; v.gain.setValueAtTime(0.0001, t); v.gain.exponentialRampToValueAtTime(g || 0.2, t + 0.01); v.gain.exponentialRampToValueAtTime(0.0001, t + d); o.connect(v); v.connect(a.destination); o.start(t); o.stop(t + d + 0.05); }
function noise(d, g, hp, at, lp) { var a = audio(); if (!a) return; var t = a.currentTime + (at || 0), n = a.sampleRate * d, b = a.createBuffer(1, n, a.sampleRate), x = b.getChannelData(0); for (var i = 0; i < n; i++) x[i] = (Math.random() * 2 - 1) * (0.6 + 0.4 * Math.sin(i / 300)); var s = a.createBufferSource(), f = a.createBiquadFilter(), v = a.createGain(); s.buffer = b; f.type = lp ? 'bandpass' : 'highpass'; f.frequency.value = hp || 1500; v.gain.value = g || 0.2; s.connect(f); f.connect(v); v.connect(a.destination); s.start(t); }
var SFX = {
  pencil: function () { noise(0.35, 0.12, 3200, 0, true); },
  ok: function (m) { var b = 523 * Math.pow(2, (m - 1) * 2 / 12); tone(b, 0.2, 'triangle', 0.22); tone(b * 1.26, 0.2, 'triangle', 0.2, 0.08); tone(b * 1.5, 0.3, 'triangle', 0.18, 0.16); },
  bad: function () { tone(330, 0.2, 'triangle', 0.22); tone(262, 0.28, 'triangle', 0.2, 0.12); },
  stamp: function () { noise(0.06, 0.4, 300); tone(110, 0.12, 'sine', 0.3); },
  end: function () { [0, 4, 7, 12].forEach(function (n, i) { tone(523 * Math.pow(2, n / 12), 0.35, 'triangle', 0.18, i * 0.1); }); }
};

/* ---------- 문제 ----------
 * 정답 카드 하나 + 미끼(서로 다른 카드). 단계 2는 미끼 대부분이 정답과 특징 하나만 다르다.
 * 드러나는 순서는 무작위(ATTRS 번호 0~3). 처음 하나는 바로 보인다.
 */
function diff(a, b) { var x = C.decode(a), y = C.decode(b), n = 0; for (var i = 0; i < 4; i++) if (x[i] !== y[i]) n++; return n; }
function near(id) { var v = C.decode(id), i = Math.floor(Math.random() * 4); v[i] = (v[i] + 1 + Math.floor(Math.random() * 2)) % 3; return C.encode(v); }
function makeMontage(level) {
  var ans = Math.floor(Math.random() * 81), n = level === 1 ? 9 : 12, cards = [ans];
  while (cards.length < n) {
    var c = level === 1 ? (Math.random() < 0.5 ? near(ans) : Math.floor(Math.random() * 81)) : (Math.random() < 0.8 ? near(ans) : near(near(ans)));
    if (cards.indexOf(c) >= 0) continue;
    cards.push(c);
  }
  for (var i = cards.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)), t = cards[i]; cards[i] = cards[j]; cards[j] = t; }
  var order = [0, 1, 2, 3]; for (var k = 3; k > 0; k--) { var r = Math.floor(Math.random() * (k + 1)), u = order[k]; order[k] = order[r]; order[r] = u; }
  return { ans: ans, cards: cards, order: order, shown: 1, step: level === 1 ? 1400 : 1100 };
}
function selfTest() {
  var bad = 0;
  for (var i = 0; i < 3000; i++) { var q = makeMontage(1 + i % 2); if (q.cards.filter(function (c) { return c === q.ans; }).length !== 1 || new Set(q.cards).size !== q.cards.length) bad++; }
  return bad;
}
window.__selfTest = selfTest;

var $ = function (id) { return document.getElementById(id); };
var startLv = 1, G = null, timer = null, revealT = null;
var WORD = function (a, v) { var w = C.ATTRS[a].values[v]; return a === 0 ? w + '에 봤어요' : a === 1 ? (v === 0 ? '모자 없음' : w) : a === 2 ? (v === 0 ? '얼굴 안 가림' : w) : w + ' 흔적'; };
var QPOS = ['t', 'h', 'f', 'm'];
function paperHtml() {
  var q = G.q, act = q.order.slice(0, q.shown).sort();
  var qs = [0, 1, 2, 3].filter(function (a) { return act.indexOf(a) < 0; }).map(function (a) { return '<span class="q ' + QPOS[a] + '">?</span>'; }).join('');
  var list = q.order.map(function (a, i) {
    return i < q.shown ? '<li class="' + (i === q.shown - 1 ? 'new' : '') + '">✓ ' + WORD(a, C.decode(q.ans)[a]) + '</li>' : '<li class="no">? ? ?</li>';
  }).join('');
  return '<div class="paper" id="paper"><div class="pic"><div class="card" style="background:' + look(q.ans, act).bg + '">' + cardInner(q.ans, null, act) + '</div>' + qs + '</div><ul>' + list + '</ul><span class="stampW">검거</span><span class="pencil" id="pencil"></span></div>';
}
function drawPaper(anim) {
  $('paperWrap').innerHTML = paperHtml();
  var m = $('mult'); m.textContent = '×' + (4 - G.q.shown + 1); m.classList.remove('drop'); void m.offsetWidth; m.classList.add('drop');
  if (anim) {
    var p = $('pencil'); p.style.left = '60px'; p.style.top = '40px'; p.classList.add('go'); SFX.pencil();
    var paper = $('paper');
    for (var i = 0; i < 6; i++) { var c = document.createElement('span'); c.className = 'crumb'; c.style.left = (40 + Math.random() * 60) + 'px'; c.style.top = (60 + Math.random() * 40) + 'px'; c.style.setProperty('--dx', (Math.random() * 30 - 15) + 'px'); paper.appendChild(c); }
  }
}
function reveal() {
  if (!G || G.over || G.q.shown >= 4) return;
  G.q.shown++; drawPaper(true);
  revealT = setTimeout(reveal, G.q.step);
}
function newQ() {
  clearTimeout(revealT);
  var lv = Math.min(2, startLv + (G.hits >= 5 ? 1 : 0));
  G.q = makeMontage(lv); G.lock = false; $('lvp').textContent = '단계 ' + lv;
  drawPaper(true);
  var b = $('board'); b.style.gridTemplateColumns = 'repeat(' + (G.q.cards.length > 9 ? 4 : 3) + ',1fr)';
  b.innerHTML = G.q.cards.map(function (id, i) { return '<button class="card enter" style="animation-delay:' + i * 30 + 'ms;background:' + look(id).bg + '" data-i="' + i + '" aria-label="' + describe(id) + '">' + cardInner(id) + '</button>'; }).join('');
  revealT = setTimeout(reveal, G.q.step);
}
function pick(i, el) {
  if (!G || G.over || G.lock) return;
  var m = 4 - G.q.shown + 1;
  if (G.q.cards[i] === G.q.ans) {
    G.lock = true; clearTimeout(revealT); G.hits++;
    G.score += 100 * m; G.left = Math.min(60, G.left + 2);
    el.classList.add('ok'); $('paper').classList.add('caught'); SFX.stamp(); setTimeout(function () { SFX.ok(m); }, 80);
    $('msg').textContent = m >= 3 ? '×' + m + ' 대단해요, 거의 보지도 않고!' : m === 2 ? '×2 빨랐어요!' : '검거!';
    $('score').textContent = G.score.toLocaleString('ko-KR');
    setTimeout(function () { var p = $('paper'); if (p) p.classList.add('fly'); }, 380);
    setTimeout(function () { if (!G.over) { $('msg').textContent = ''; newQ(); } }, 820);
  } else {
    G.left -= 5; el.classList.remove('bad'); void el.offsetWidth; el.classList.add('bad'); SFX.bad();
    $('msg').textContent = '다른 사람이에요 (−5초)';
  }
}
function tick() {
  var now = performance.now(); G.left -= (now - G.last) / 1000; G.last = now;
  $('bari').style.transform = 'scaleX(' + Math.max(0, G.left / 60) + ')'; $('bar').classList.toggle('low', G.left < 10);
  if (G.left <= 0) {
    G.over = true; clearInterval(timer); clearTimeout(revealT); SFX.end();
    $('cover').hidden = false;
    $('cover').querySelector('.box').innerHTML = '<span class="label">수배 종료</span><div class="big">' + G.score.toLocaleString('ko-KR') + '</div><p style="text-align:center">검거 ' + G.hits + '명</p><button class="go" onclick="location.reload()">다시 하기</button>';
  }
}
function start() {
  audio(); if (AC && AC.resume) AC.resume();
  $('cover').hidden = true;
  G = { hits: 0, score: 0, left: 60, last: performance.now(), over: false };
  newQ(); timer = setInterval(tick, 100);
}
$('lvsel').onclick = function (e) { var b = e.target.closest('button'); if (!b) return; startLv = +b.dataset.l; document.querySelectorAll('#lvsel button').forEach(function (x) { x.classList.toggle('on', x === b); }); };
$('go').onclick = start;
$('board').addEventListener('click', function (e) { var b = e.target.closest('.card'); if (b) pick(+b.dataset.i, b); });
G = { hits: 0, score: 0, left: 60, over: true }; G.q = makeMontage(1); G.q.shown = 2; drawPaper(false);
$('board').style.gridTemplateColumns = 'repeat(3,1fr)'; $('board').innerHTML = G.q.cards.map(function (id) { return '<div class="card" style="background:' + look(id).bg + '">' + cardInner(id) + '</div>'; }).join('');
</script>
</body>
</html>
